<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guest Plate Details</title>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

  <!-- Scripts -->
  <script src="../../style/js/plugin.js"></script>
  <script src="../../style/js/bootstrap-datepicker.min.js"></script>
  <script src="../../style/js/clockpicker.js"></script>
  <script src="../../style/js/custom.js"></script>
  <script src="../../style/js/config.js"></script>
  <script src="../../style/js/formatDate.js"></script>
  <script src="/sessionstorage.js"></script>
  <script src="issuedGuestPlateReport.js" defer></script>
  <script src="../../style/js/tableSortFilter.js" defer></script>
  <script src="/style/js/roleCheck.js"></script>
  <script>
    checkRoleAccess(['foodAdmin', 'superAdmin']);
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="../../style/css/styles.css" />
</head>

<body>
  <div class="header">
    <div class="container">
      <div class="logout">
        <a href="javascript:void(0);" onclick="history.back()">Back</a> &nbsp; | &nbsp;
        <a href="javascript:void(0);" onclick="goToHome()">Home</a> &nbsp; | &nbsp;
        <a href="javascript:void(0);" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <div class="middlecontent">
    <div class="container">
      <div class="whitesec">
        <div class="inner-padding">

          <div class="frm-head" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <h1 id="reportTitle">Guest Plate Report</h1>
            <button onclick="exportGuestCSV()" class="btn btn-secondary" style="background:#27ae60;color:#fff;border-color:#27ae60;">⬇ Export CSV</button>
            <div id="alertBox" style="display: none; padding: 10px; margin-top: 10px; border-radius: 5px; font-weight: bold;"></div>
          </div>

          <input type="text" id="tableSearch" class="form-control search-box" placeholder="Search...">

          <div class="table-responsive">
            <table id="guestTable" class="table table-striped table-bordered">
              <thead id="guestReportTableHead">
  <!-- Header will be dynamically rendered by JS -->
</thead>
<tbody id="guestReportTableBody">
                <!-- Rows will be dynamically populated -->
              </tbody>
            </table>
          </div>
          <!-- Pagination -->
          <div id="guestPaginationContainer"></div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
