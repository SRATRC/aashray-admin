<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload WiFi Codes</title>

    <!-- Load jQuery first -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

    <!-- Shared Styles and Scripts -->
    <link rel="stylesheet" href="../../style/css/styles.css" />
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/bootstrap-datepicker.min.js"></script>
    <script src="../../style/js/clockpicker.js"></script>
    <script src="../../style/js/custom.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="../../sessionstorage.js"></script>
    <script src="../../style/js/common.js"></script>

    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  </head>

  <body>
    <!-- Header -->
    <div class="header">
      <div class="container">
        <div class="logout">
          <a href="javascript:void(0);" onclick="history.back()">Back</a>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="goToHome()">Home</a>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="middlecontent">
      <div class="container">
        <div class="whitesec">
          <div class="inner-padding">
            <div class="frm-head">
              <h1>Upload New WiFi Codes</h1>
            </div>

            <div class="form-group">
              <input class="btn btn-primary" type="file" id="excelFile" accept=".xlsx" />
              <button class="btn btn-primary" id="parseBtn">Preview</button>
              <button class="btn btn-primary" id="uploadBtn">Update WiFi DB</button>
              <button class="btn btn-info" id="downloadSampleBtn">Download Sample Excel</button>
            </div>

            
            <div id="tableContainer" style="margin-top: 20px;"></div>

            <hr style="margin: 30px 0; border-top: 1px solid #ddd;" />

            <div class="frm-head">
              <h2>Bulk Deactivate / Reactivate / Delete from Excel</h2>
            </div>

            <div class="form-group" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <label for="bulkActionSelect" style="margin:0; font-weight:600;">Action:</label>
              <select id="bulkActionSelect" class="form-control" style="width:auto; display:inline-block;">
                <option value="deactivate">Deactivate Codes</option>
                <option value="reactivate">Reactivate Codes</option>
                <option value="delete">Delete Codes (Soft Delete)</option>
              </select>

              <label style="display:inline-flex; align-items:center; gap:5px; margin:0 5px; cursor:pointer;">
                <input type="checkbox" id="bulkActionDryRun" /> Dry Run
              </label>

              <input class="btn btn-primary" type="file" id="bulkActionFile" accept=".xlsx,.xls" />
              <button class="btn btn-warning" id="bulkActionBtn">Execute Action</button>
              <button class="btn btn-info" id="downloadActiveBtn">Download Active Codes</button>
            </div>

            <div id="bulkActionResult" style="margin-top: 15px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS module for Excel upload logic -->
    <script type="module" src="uploadCodes.js"></script>
  </body>
</html>
