<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Adhyayan Attendance Scanner (Mobile)</title>

    <link rel="manifest" href="/manifest.json" />

    <script src="../../style/js/jquery.min.js"></script>
    <script>
      window.jQuery || document.write('<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"><\/script>');
    </script>
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/custom.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="../../sessionstorage.js"></script>
    <script src="../../style/js/html5-qrcode.min.js"></script>
    <script>
      window.Html5Qrcode || document.write('<script src="https://unpkg.com/html5-qrcode"><\/script>');
    </script>

    <!-- Offline PWA & Kiosk Layer -->
    <script src="../../style/js/offline-db.js"></script>
    <script src="../../style/js/stationAuth.js"></script>
    <script src="../../style/js/scannerCommon.js"></script>
    <script src="../../style/js/pwa-register.js"></script>
    <script src="./adhyayanAttendanceScanMob.js"></script>

    <link rel="stylesheet" href="../../style/css/styles.css" />

    <style>
      #qr-scanner-section {
        text-align: center;
        margin-bottom: 20px;
      }

      #qr-status {
        margin: 20px auto;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        border-radius: 12px;
        min-height: 40px;
        max-width: 500px;
        transition: all 0.3s ease;
      }

      .network-badge-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .network-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
      }

      .network-badge.online {
        background-color: #e6fffa;
        color: #234e52;
        border: 1px solid #b2f5ea;
      }

      .network-badge.offline {
        background-color: #fffaf0;
        color: #7b341e;
        border: 1px solid #feebc8;
      }

      .queue-count {
        font-size: 13px;
        color: #ffffff;
        font-weight: 600;
      }

      .btn-sync, .btn-topbar {
        padding: 3px 10px;
        font-size: 12px;
        border-radius: 4px;
        background-color: #319795;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .btn-topbar-secondary {
        background-color: #4a5568;
      }

      .btn-sync:disabled, .btn-topbar:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .station-clock {
        font-size: 13px;
        color: #e2e8f0;
        font-weight: bold;
        margin-right: 8px;
      }

      .session-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding: 10px;
        background: #f7fafc;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
      }

      .session-select {
        font-size: 16px;
        font-weight: bold;
        padding: 6px 12px;
        border-radius: 6px;
        border: 2px solid #319795;
        background-color: #ffffff;
        color: #2d3748;
      }

      .success-status {
        background-color: #d4edda;
        color: #155724;
        border: 3px solid #28a745;
      }

      .error-status {
        background-color: #f8d7da;
        color: #721c24;
        border: 3px solid #dc3545;
      }

      .warning-status {
        background-color: #fff3cd;
        color: #856404;
        border: 3px solid #ffc107;
      }

      .scanning-status {
        background-color: #e2e3e5;
        color: #383d41;
        border: 3px solid #6c757d;
      }

      #scan-again-btn {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="container">
        <div class="logout">
          <div class="network-badge-container">
            <span class="station-clock">🕒 <span id="station-clock">--:--</span></span>
            <span id="network-badge" class="network-badge online">🟢 Online</span>
            <span id="queue-count" class="queue-count">0 Pending Scans</span>
            <button id="sync-now-btn" class="btn-sync" style="display: none;">Sync Now</button>
            <button id="update-data-btn" class="btn-topbar">⬇️ Update Data</button>
            <button id="pwa-install-btn" class="btn-topbar" style="display: none; background: #2b6cb0;">📲 Install App</button>
            <button id="reset-station-btn" class="btn-topbar btn-topbar-secondary" title="Reset local station cache">🗑️ Reset Station</button>
          </div>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="history.back()">Back</a>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="goToHome()">Home</a>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>

    <div class="middlecontent">
      <div class="container">
        <div class="whitesec">
          <div class="inner-padding">
            <div class="frm-head">
              <h1 id="scanner-heading">Adhyayan Attendance Scanner</h1>
            </div>

            <div class="session-bar">
              <label for="session-select" style="font-weight: 600; margin: 0;">Active Session:</label>
              <select id="session-select" class="session-select">
                <option value="1">Session 1</option>
              </select>
            </div>

            <div id="alert" class="alert" role="alert" style="display: none;"></div>

            <div id="qr-scanner-section">
              <div id="reader" style="max-width: 400px; margin: auto;"></div>
              <div id="qr-status" class="scanning-status">Initializing scanner...</div>
              <button id="scan-again-btn" class="btn btn-small" style="display: none;">
                Scan Another
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </body>
</html>
