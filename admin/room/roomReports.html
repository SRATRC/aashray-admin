<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Booking Reports</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="../../style/js/plugin.js"></script>
  <script src="../../style/js/bootstrap-datepicker.min.js"></script>
  <script src="../../style/js/clockpicker.js"></script>
  <script src="../../style/js/custom.js"></script>
  <script src="../../style/js/config.js"></script>
  <script src="../../style/js/formatDate.js"></script>
  <script src="/sessionstorage.js"></script>
  <script src="roomReports.js" defer></script>
  <script src="../../style/js/tableSortFilter.js" defer></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="../../style/js/exportToExcel.js"></script>
  <script src="/style/js/roleCheck.js"></script>
  <script>
    checkRoleAccess(['officeAdmin', 'roomAdmin', 'superAdmin']);
  </script>

  <link rel="stylesheet" href="../../style/css/styles.css" />
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: auto;
      padding: 20px;
      border: 1px solid #888;
      width: 50%;
      border-radius: 5px;
    }

    .modal-header {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-actions {
      text-align: right;
      margin-top: 15px;
    }

    .modal-actions button {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="logout">
        <a href="javascript:void(0);" onclick="history.back()">Back</a> |
        <a href="javascript:void(0);" onclick="goToHome()">Home</a> |
        <a href="javascript:void(0);" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <div class="middlecontent">
    <div class="container">
      <div class="whitesec">
        <div class="inner-padding">
          <div class="frm-head">
            <h1>Room Booking Reports</h1>
          </div>

          <div class="form">
            <div id="alert" class="alert" style="display:none;"></div>
            <form id="reportForm">
              <div class="form-group">
                <label for="report_type">Report Type:</label>
                <select id="report_type" name="report_type" class="form-control" required>
                  <option value="reservation_report" data-type="room">Room Reservation Report</option>
                  <option value="flat_reservation_report" data-type="flat">Flat Reservation Report</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status:</label>
                <div class="checkbox-group" style="display: flex; flex-wrap: wrap; gap: 1rem;">
                  <label><input type="checkbox" name="status" value="checkedin" checked /> Checked-in</label>
                  <label><input type="checkbox" name="status" value="checkedout" /> Checked-out</label>
                  <label><input type="checkbox" name="status" value="pending checkin" /> Pending Check-in</label>
                  <label><input type="checkbox" name="status" value="waiting" /> Waiting</label>
                  <label><input type="checkbox" name="status" value="pending" /> Pending</label>
                  <label><input type="checkbox" name="status" value="cancelled" /> Cancelled By User</label>
                  <label><input type="checkbox" name="status" value="admin cancelled" /> Cancelled By Admin</label>
                </div>
              </div>

              <div class="form-group">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" class="form-control" required />
              </div>

              <div class="form-group">
                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" class="form-control" required />
              </div>

              <div class="form-group form-submit">
                <button type="submit" class="btn btn-primary">Submit</button>
                <div id="downloadBtnContainer"></div>
              </div>
            </form>
          </div>

          <div class="table-responsive">
            <!-- Bulk Action Toolbar -->
            <div id="bulkActionsBar" style="display: none; margin-bottom: 12px; padding: 10px 16px; background: #eef6fc; border: 1px solid #cce4f7; border-radius: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <strong id="selectedCountText" style="color: #0b5ed7; font-size: 14px;">0 bookings selected</strong>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="clearSelectionBtn" style="padding: 2px 8px; font-size: 12px;">Clear Selection</button>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" class="btn btn-sm btn-success" id="bulkCheckinBtn" style="font-weight: 500;">
                  ✅ Bulk Check-in
                </button>
                <button type="button" class="btn btn-sm btn-warning" id="bulkCheckoutBtn" style="font-weight: 500; color: #ffffff; background-color: #d97706; border-color: #b45309;">
                  🚪 Bulk Check-out
                </button>
                <button type="button" class="btn btn-sm btn-primary" id="bulkStatusUpdateBtn" style="font-weight: 500;">
                  🔄 Update Status
                </button>
                <button type="button" class="btn btn-sm btn-danger" id="bulkCancelBtn" style="font-weight: 500;">
                  ❌ Bulk Cancel
                </button>
              </div>
            </div>

            <input type="text" id="tableSearch" class="form-control search-box" placeholder="Search...">
            <table id="reportTable" class="table table-striped table-bordered">
              <thead>
                <tr>
                  <th style="width: 36px; text-align: center;" class="no-enhance">
                    <input type="checkbox" id="selectAllCheckbox" style="margin: 0; cursor: pointer;" title="Select All" />
                  </th>
                  <th>#</th>
                  <th>Booking Id</th>
                  <th>Guest Name</th>
                  <th>Mobile No.</th>
                  <th>Center</th>
                  <th>Room No</th>
                  <th>Room Type</th>
                  <th>Check-in</th>
                  <th>Check-out</th>
                  <th>Nights</th>
                  <th>Booking Status</th>
                  <th>Payment Status</th>
                  <th>Description</th>
                  <th>Booked By</th>
                  <th>Action</th>
                  <th>Cancel</th>
                </tr>
              </thead>
              <tbody id="reportTableBody">
                <!-- JS will populate -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for "waiting" status update -->
<!-- Modal for "waiting" status update -->
<div id="roomUpdateModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Update Booking Status</div>
    <form id="roomStatusForm">
      <div class="form-group">
        <label for="modal_bookingid_display">Booking ID:</label>
        <input type="text" id="modal_bookingid_display" class="form-control" readonly disabled />
        <input type="hidden" id="modal_bookingid" />
      </div>

      <div class="form-group">
        <label for="modal_credits">Room Credits Available:</label>
        <input type="text" id="modal_credits" class="form-control" readonly disabled />
      </div>

      <div class="form-group">
        <label for="modal_base_amount">Base Amount (₹):</label>
        <input type="text" id="modal_base_amount" class="form-control" readonly disabled />
      </div>

      <div class="form-group">
        <label for="modal_credits_used">Credits Used (₹):</label>
        <input type="text" id="modal_credits_used" class="form-control" readonly disabled />
      </div>

      <div class="form-group">
        <label for="modal_discounted_amount">Amount After Credits (₹):</label>
        <input type="text" id="modal_discounted_amount" class="form-control" readonly disabled />
      </div>

      <div class="form-group">
        <label for="modal_status">New Status:</label>
        <select id="modal_status" required class="form-control">
          <option value="">-- Select --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modal_description">Remarks (optional):</label>
        <textarea id="modal_description" class="form-control" placeholder="Any note or reason..."></textarea>
      </div>

      <!-- ✅ New Room No Field (conditionally visible) -->
      <div class="form-group" id="modal_roomno_group" style="display: none;">
        <label for="modal_roomno">Room No:</label>
        <input type="text" id="modal_roomno" class="form-control" />
      </div>

      <div class="modal-actions">
        <button type="button" id="closeRoomModal" class="btn btn-secondary">Close</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

  
<!-- Modal for Bulk Status update -->
<div id="bulkStatusModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Bulk Update Booking Status</div>
    <form id="bulkStatusForm">
      <div class="form-group">
        <label>Selected Bookings:</label>
        <div id="bulkModalCount" style="font-weight: bold; color: #0b5ed7; font-size: 15px; margin-bottom: 5px;">0 bookings selected</div>
      </div>

      <div class="form-group">
        <label for="bulk_modal_status">New Status:</label>
        <select id="bulk_modal_status" required class="form-control">
          <option value="">-- Select Status --</option>
          <option value="pending checkin">Pending Check-in</option>
          <option value="checkedin">Checked-in</option>
          <option value="checkedout">Checked-out</option>
          <option value="waiting">Waiting</option>
          <option value="pending">Pending</option>
          <option value="admin cancelled">Cancelled by Admin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bulk_modal_description">Remarks (optional):</label>
        <textarea id="bulk_modal_description" class="form-control" placeholder="Any note or reason for all selected bookings..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" id="closeBulkModal" class="btn btn-secondary">Close</button>
        <button type="submit" class="btn btn-primary" id="submitBulkStatusBtn">Apply to Selected</button>
      </div>
    </form>
  </div>
</div>

  <!-- Init features -->
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      enhanceTable('reportTable', 'tableSearch');
    });
  </script>
</body>
</html>
