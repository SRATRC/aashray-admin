<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Builder - Aashray Admin</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="../../sessionstorage.js"></script>
    <script src="../../style/js/roleCheck.js"></script>
    <script>
      checkRoleAccess([
        'superAdmin', 'accountsAdmin', 'roomAdmin', 'cardAdmin',
        'officeAdmin', 'foodAdmin', 'gateAdmin', 'adhyayanAdmin',
        'travelAdmin', 'maintenanceAdmin', 'housekeepingAdmin',
        'electricalAdmin', 'utsavAdmin', 'avtAdmin', 'wifiAdmin'
      ]);
    </script>

    <!-- Include FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../style/css/styles.css" />
    
    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .top-bar h1 {
        color: #204060;
        font-size: 1.8rem;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.25rem 0.75rem;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-active {
        background-color: #e2fbe8;
        color: #1e7e34;
        border: 1px solid #c3e6cb;
      }
      .badge-inactive {
        background-color: #fdf2f2;
        color: #dc3545;
        border: 1px solid #f5c6cb;
      }
      .badge-public {
        background-color: #e8f4fd;
        color: #004085;
        border: 1px solid #b8daff;
      }
      .badge-auth {
        background-color: #fff9e6;
        color: #856404;
        border: 1px solid #ffeeba;
      }
      .actions-cell {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-sm {
        padding: 0.4rem 0.75rem;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-danger {
        background-color: #dc3545;
      }
      .btn-danger:hover {
        background-color: #bd2130;
        transform: translateY(-1px);
      }
      .btn-success {
        background-color: #28a745;
      }
      .btn-success:hover {
        background-color: #218838;
        transform: translateY(-1px);
      }
      .btn-info {
        background-color: #17a2b8;
      }
      .btn-info:hover {
        background-color: #138496;
        transform: translateY(-1px);
      }
      .btn-warning {
        background-color: #ffc107;
        color: #212529;
      }
      .btn-warning:hover {
        background-color: #e0a800;
        transform: translateY(-1px);
      }
      .empty-state {
        text-align: center;
        padding: 4rem 1rem;
        color: #6c757d;
      }
      .empty-state i {
        font-size: 3rem;
        color: #dee2e6;
        margin-bottom: 1rem;
      }
      .empty-state h3 {
        margin-bottom: 0.5rem;
        color: #204060;
        font-weight: 700;
      }
      #alert {
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        display: none;
        animation: fadeIn 0.3s ease-out;
        font-weight: 500;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      #alert.alert-success {
        display: block;
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      #alert.alert-danger {
        display: block;
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .response-count {
        font-weight: 700;
        color: #204060;
        background: #f1f3f5;
        padding: 0.2rem 0.6rem;
        border-radius: 50px;
        font-size: 0.85rem;
      }
      
      /* Premium Table overrides */
      .table {
        background: white;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #dee2e6;
      }
      .table th {
        background-color: #204060;
        color: white;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
        padding: 1rem 0.75rem;
      }
      .table td {
        padding: 1rem 0.75rem;
        vertical-align: middle;
        border-bottom: 1px solid #eee;
        color: #495057;
      }
      .table tbody tr:last-child td {
        border-bottom: none;
      }
      .table tbody tr {
        transition: background-color 0.2s;
      }
      .table tbody tr:hover {
        background-color: #f8f9fa !important;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="container">
        <div class="logout">
          <a href="../adminhome.html"><i class="fas fa-home"></i> Admin Home</a> |
          <a id="homelink" href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>

    <div class="middlecontent">
      <div class="container">
        <div class="whitesec">
          <div class="inner-padding">
            <div class="top-bar">
              <h1><i class="fas fa-poll-h"></i> Custom Forms</h1>
              <a href="create.html" class="btn"><i class="fas fa-plus-circle"></i> Create New Form</a>
            </div>

            <div id="alert"></div>

            <div class="table-responsive">
              <table class="table" id="formsTable">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Access Type</th>
                    <th>Responses</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="formsBody">
                  <tr>
                    <td colspan="8" style="text-align: center; color: #6c757d;"><i class="fas fa-spinner fa-spin"></i> Loading forms...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const token = sessionStorage.getItem('token');

      async function loadForms() {
        try {
          const res = await fetch(`${CONFIG.basePath}/forms`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();

          if (!data.success) {
            showError(data.message || 'Failed to load forms');
            return;
          }

          renderForms(data.data);
        } catch (err) {
          showError('Error loading forms: ' + err.message);
        }
      }

      function renderForms(forms) {
        const tbody = document.getElementById('formsBody');

        if (!forms || forms.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8">
                <div class="empty-state">
                  <i class="fas fa-folder-open"></i>
                  <h3>No forms created yet</h3>
                  <p>Click "Create New Form" above to define your first customized dynamic form.</p>
                </div>
              </td>
            </tr>`;
          return;
        }

        tbody.innerHTML = forms.map((form, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${escapeHtml(form.title)}</strong></td>
            <td><span style="font-weight: 500; color:#495057;">${escapeHtml(form.dept_name)}</span></td>
            <td>
              <span class="badge ${form.status === 'active' ? 'badge-active' : 'badge-inactive'}">
                <i class="fas ${form.status === 'active' ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${form.status}
              </span>
            </td>
            <td>
              <span class="badge ${form.isPublic ? 'badge-public' : 'badge-auth'}">
                <i class="fas ${form.isPublic ? 'fa-globe' : 'fa-lock'}"></i> ${form.isPublic ? 'Public' : 'Auth'}
              </span>
            </td>
            <td><span class="response-count">${form.dataValues?.responseCount ?? form.responseCount ?? 0}</span></td>
            <td>${new Date(form.createdAt).toLocaleDateString()}</td>
            <td>
              <div class="actions-cell">
                <button class="btn btn-sm btn-info" onclick="copyLink(${form.id}, '${form.slug || ''}')" title="Copy public link"><i class="fas fa-copy"></i> Link</button>
                <a href="responses.html?id=${form.id}" class="btn btn-sm btn-success" title="View responses"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="create.html?id=${form.id}" class="btn btn-sm btn-warning" title="Edit form"><i class="fas fa-edit"></i> Edit</a>
                <button class="btn btn-sm btn-danger" onclick="deleteForm(${form.id})" title="Delete form"><i class="fas fa-trash-alt"></i> Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function copyLink(formId, slug) {
        const link = slug
          ? `${window.location.origin}/go/${slug}`
          : `${window.location.origin}/admin/forms/view.html?id=${formId}`;
        navigator.clipboard.writeText(link).then(() => {
          showSuccess('Public form link copied to clipboard!');
        }).catch(() => {
          prompt('Copy this link:', link);
        });
      }

      async function deleteForm(formId) {
        if (!confirm('Are you sure you want to delete this form? All responses will be deleted permanently.')) {
          return;
        }

        try {
          const res = await fetch(`${CONFIG.basePath}/forms/${formId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();

          if (data.success) {
            showSuccess('Form deleted successfully');
            loadForms();
          } else {
            showError(data.message || 'Failed to delete form');
          }
        } catch (err) {
          showError('Error deleting form: ' + err.message);
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function showSuccess(msg) {
        const alert = document.getElementById('alert');
        alert.className = 'alert-success';
        alert.textContent = msg;
        alert.style.display = 'block';
        setTimeout(() => { alert.style.display = 'none'; }, 3000);
      }

      function showError(msg) {
        const alert = document.getElementById('alert');
        alert.className = 'alert-danger';
        alert.textContent = msg;
        alert.style.display = 'block';
      }

      // Load forms on page load
      loadForms();
    </script>
  </body>
</html>
