<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Form - Aashray</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/config.js"></script>

    <!-- Include FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="../../style/css/styles.css" />
    <style>
      :root {
        --theme-color: #204060;
      }

      body {
        background-color: #f0f2f5;
        padding: 2rem 1rem;
        font-family: 'Inter', -apple-system, sans-serif;
      }

      .form-container {
        max-width: 680px;
        margin: 0 auto;
      }

      .form-header {
        background: #fff;
        border-top: 10px solid var(--theme-color);
        border-radius: 8px;
        padding: 2.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      }

      .form-header h1 {
        margin: 0 0 0.75rem 0;
        color: var(--theme-color);
        font-size: 2rem;
        font-weight: 800;
        word-wrap: break-word;
      }

      .form-header p {
        margin: 0;
        color: #495057;
        font-size: 0.95rem;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .form-body {
        background: #fff;
        border-radius: 8px;
        padding: 2.25rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        margin-bottom: 1.25rem;
      }

      .field-group {
        margin-bottom: 2rem;
      }

      .field-group label {
        display: block;
        font-weight: 700;
        color: var(--theme-color);
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .field-group .required {
        color: #dc3545;
        margin-left: 0.2rem;
      }
      
      /* Input styles */
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      select,
      textarea {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 0.95rem;
        background-color: #fafafa;
        transition: border-color 0.2s, background-color 0.2s;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="date"]:focus,
      input[type="time"]:focus,
      select:focus,
      textarea:focus {
        border-color: #4c86b0;
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(76, 134, 176, 0.1);
      }

      textarea {
        resize: vertical;
      }

      /* Options layout */
      .option-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.6rem;
      }

      .option-item input[type="radio"],
      .option-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--theme-color);
      }

      .option-item label {
        margin: 0;
        font-weight: 400;
        color: #495057;
        cursor: pointer;
        font-size: 0.95rem;
      }

      /* Star rating design */
      .star-rating {
        display: inline-flex;
        gap: 0.4rem;
        font-size: 2.2rem;
        cursor: pointer;
      }

      .star-rating .star {
        color: #dee2e6;
        transition: color 0.15s, transform 0.1s;
      }

      .star-rating .star:hover {
        transform: scale(1.15);
      }

      .star-rating .star.selected,
      .star-rating .star.hovered {
        color: #ffc107;
      }

      /* Matrix Grid design */
      .grid-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }

      .grid-table th {
        background: #f8f9fa;
        color: var(--theme-color);
        font-weight: 700;
        padding: 0.75rem;
        text-align: center;
        border: 1px solid #dee2e6;
      }

      .grid-table td {
        padding: 0.75rem;
        text-align: center;
        border: 1px solid #dee2e6;
      }

      .grid-table td:first-child {
        text-align: left;
        font-weight: 600;
        color: #495057;
        background: #fbfbfb;
      }

      .grid-table input[type="radio"],
      .grid-table input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--theme-color);
      }

      /* Quick-fill column headers: click once to apply that answer to every row,
         instead of clicking each row individually. */
      .grid-table th.grid-col-quickfill {
        cursor: pointer;
        transition: background-color 0.15s ease;
        user-select: none;
      }
      .grid-table th.grid-col-quickfill:hover {
        background: #e3ecf5;
      }
      .grid-table th.grid-col-quickfill:active {
        background: #d3e0ee;
      }
      .grid-col-quickfill-hint {
        display: block;
        font-size: 0.65rem;
        font-weight: 500;
        color: #6c757d;
        margin-top: 0.2rem;
        text-transform: none;
        letter-spacing: 0;
      }

      /* Success Screen */
      .success-screen {
        background: #fff;
        border-radius: 8px;
        padding: 3rem 2.25rem;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      }

      .success-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }

      .success-screen h2 {
        color: var(--theme-color);
        margin-top: 0;
        margin-bottom: 0.75rem;
        font-weight: 800;
      }

      .success-screen p {
        color: #6c757d;
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
      }

      /* Alert blocks */
      [id^="formAlert_"] {
        padding: 0.75rem 1.25rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        display: none;
        font-weight: 500;
      }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

      .submit-btn {
        background-color: var(--theme-color);
        color: white;
        border: none;
        padding: 0.75rem 1.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        box-shadow: 0 4px 6px rgba(32, 64, 96, 0.15);
      }

      .submit-btn:hover {
        opacity: 0.9;
      }

      .submit-btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }

      .auth-section {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 1.25rem;
        border-radius: 8px;
        margin-bottom: 2rem;
      }

    .loading-state,
    .error-state {
        text-align: center;
        padding: 4rem 2rem;
      }

      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: var(--theme-color);
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem auto;
      }

      @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

      .error-state i {
        font-size: 3rem;
        color: #dc3545;
        margin-bottom: 1rem;
      }

      .error-state h2 {
        margin-bottom: 0.5rem;
      }

      @media (max-width: 600px) {
        body {
          padding: 0.75rem 0.25rem;
        }

        .form-header {
          padding: 1.25rem 1rem;
        }

        .form-body {
          padding: 1.25rem 0.75rem;
        }

        .form-header h1 {
          font-size: 1.35rem;
        }

        .matrix-table th, .matrix-table td {
          padding: 0.35rem 0.2rem !important;
          font-size: 0.8rem !important;
        }

        .matrix-table input.grid-number-cell {
          max-width: 52px !important;
          padding: 0.3rem 0.15rem !important;
          font-size: 0.85rem !important;
        }

        .matrix-table input[placeholder="Set all"] {
          max-width: 58px !important;
          height: 26px !important;
          font-size: 0.74rem !important;
          padding: 0.15rem 0.2rem !important;
          box-sizing: border-box !important;
        }
      }
    </style>
  </head>

  <body>
  <div id="previewBanner"
    style="display:none; position:fixed; top:0; left:0; right:0; background:#ffc107; color:#212529; text-align:center; padding:0.6rem; font-weight:700; font-size:0.95rem; z-index:9999; box-shadow:0 2px 5px rgba(0,0,0,0.15);">
      <i class="fas fa-eye"></i> Form Preview Mode — Responses will not be submitted
    </div>

    <div class="form-container" id="formContainer">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Loading form...</p>
      </div>
    </div>

    <script>
      // If the browser restores this page from its back-forward cache (e.g.
      // the user hits Back), the entire DOM is served frozen exactly as it
      // was left — none of this script re-runs, so any auth/draft state
      // that was cleared or changed since would appear stale or reversed.
      // Force a real reload whenever that happens so the page always
      // reflects current state.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      });

      const urlParams = new URLSearchParams(window.location.search);
      const formId = urlParams.get('id');

      let formData = null;

      async function loadForm() {
        if (urlParams.get('preview') === 'true') {
          try {
            const rawData = sessionStorage.getItem('preview_form_data');
            if (!rawData) {
              showErrorState('No preview data found. Please open preview from the Form Builder.');
              return;
            }
            formData = JSON.parse(rawData);
            document.title = `[Preview] ${formData.title} - Aashray`;
            renderForm(formData);
          } catch (err) {
            showErrorState('Failed to load preview form data.');
          }
          return;
        }

        if (!formId) {
          showErrorState('No form ID specified in the URL.');
          return;
        }

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}`);
          const data = await res.json();

          if (!data.success) {
            showErrorState(data.message || 'Form not found or inactive.');
            return;
          }

          formData = data.data;

          // Limit to 1 response client-side check (only if not editing)
          if (formData.limitOneResponse && !formData.allowEdit && !urlParams.get('responseId') && localStorage.getItem(`form_submitted_${formId}`) === 'true') {
            showAlreadySubmittedState();
            return;
          }
          
          if (formData.isClosed && urlParams.get('preview') !== 'true') {
            renderClosedScreen(formData);
            return;
          }

          document.title = `${formData.title} - Aashray`;
          renderForm(formData);

          // If editing response, load previous responses
          const responseId = urlParams.get('responseId');
          if (responseId && formData.allowEdit) {
            await loadAndPopulateResponse(responseId);
          } else if (!responseId) {
            // We don't know WHO is opening this link (it could be
            // shared/forwarded, or the device could be shared), so we never
            // silently restore or prefill an email. We only show a generic,
            // non-identifying hint; the visitor must actively prove who they
            // are (type their email, or — on authenticated forms — resolve
            // their mobile/card number) before anything is restored.
            if (localStorage.getItem(`form_has_draft_${formId}`) === 'true') {
              const hintEl = document.getElementById('draftHintMsg');
              if (hintEl) {
                hintEl.textContent = 'Have a saved draft on this form? Check "Save my progress" above and enter your email to resume it.';
                hintEl.style.display = 'block';
              }
            }
          }
        } catch (err) {
          showErrorState('Unable to load form. Please try again later.');
        }
      }

      // Secure DOM-based HTML Sanitizer for B, I, U, A elements
      function renderRichText(text) {
        if (!text) return '';
        const parser = new DOMParser();
        const doc = parser.parseFromString(`<div>${text}</div>`, 'text/html');
        const allowedTags = ['B', 'I', 'U', 'A', 'BR', 'STRONG', 'EM', 'SPAN', 'P'];
        
        function sanitizeNode(node) {
          const children = Array.from(node.childNodes);
          children.forEach(child => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              if (!allowedTags.includes(child.nodeName)) {
                const textNode = doc.createTextNode(child.textContent);
                node.replaceChild(textNode, child);
              } else {
                if (child.nodeName === 'A') {
                  const href = child.getAttribute('href');
                  child.removeAttribute('onclick');
                  child.removeAttribute('onerror');
                  child.setAttribute('target', '_blank');
                  child.setAttribute('rel', 'noopener noreferrer');
                }
                sanitizeNode(child);
              }
            }
          });
        }
        
        sanitizeNode(doc.body.firstChild);
        return doc.body.firstChild.innerHTML;
      }

      function renderClosedScreen(form) {
        const container = document.getElementById('formContainer');
        const msg = form.closeMessage || 'This form is no longer accepting responses.';
        
        container.innerHTML = `
          <div class="success-screen" style="border-top: 10px solid #dc3545; max-width:600px; margin:2rem auto; background:#fff; border-radius:8px; padding:3rem 2rem; box-shadow:0 4px 6px rgba(0,0,0,0.03); text-align:center;">
            <div class="success-icon" style="color: #dc3545; font-size:4rem; margin-bottom:1.5rem;"><i class="fas fa-exclamation-circle"></i></div>
            <h2 style="color:#204060; margin:0 0 1rem 0; font-weight:800;">Form Closed</h2>
            <p style="margin: 0; color: #495057; font-size: 1.1rem; line-height: 1.6;">${renderRichText(msg)}</p>
            <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
              <span style="font-size: 0.85rem; color: #6c757d;">This form has expired or reached its submission limit.</span>
            </div>
          </div>
        `;
      }

      function renderForm(form) {
        const container = document.getElementById('formContainer');

        const themeColor = form.themeColor || '#204060';
        document.documentElement.style.setProperty('--theme-color', themeColor);

        if (urlParams.get('preview') === 'true') {
          document.getElementById('previewBanner').style.display = 'block';
          container.style.marginTop = '4rem';
        }

        // Separate fields into page sections
        const pages = [];
        let currentPage = {
          id: 'page_0',
          title: form.title,
          description: form.description,
          fields: [],
          nextAction: form.section1Action || 'next'
        };

        const isAuth = !form.isPublic;

        form.fields.forEach(field => {
          if (field.type === 'section') {
            pages.push(currentPage);
            currentPage = {
              id: field.id,
              title: field.label,
              description: field.description || '',
              fields: [],
              nextAction: field.nextAction || 'next'
            };
          } else {
            currentPage.fields.push(field);
          }
        });
        pages.push(currentPage);

        window.pageIndices = {};
        pages.forEach((p, idx) => {
          window.pageIndices[p.id] = idx;
        });

        // Render progress bar container
        let progressHtml = '';
        if (form.showProgressBar) {
          progressHtml = `
            <div id="progressContainer" style="margin-top: 1.5rem; padding: 1rem 1.5rem; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
              <div style="display:flex; justify-content:space-between; font-size:0.95rem; color:#000000; font-weight:700; margin-bottom:0.4rem;">
                <span>Progress</span>
                <span id="progressText">Page 1 of ${pages.length}</span>
              </div>
              <div style="width:100%; height:8px; background:#e9ecef; border-radius:50px; overflow:hidden;">
                <div id="progressBar" style="width:${(1 / pages.length) * 100}%; height:100%; background:linear-gradient(135deg, var(--theme-color) 0%, #4c86b0 100%); transition:width 0.3s ease;"></div>
              </div>
            </div>
          `;
        }

        let pagesHtml = '';
        pages.forEach((page, pi) => {
          let fieldsHtml = '';
          
          if (pi === 0 && isAuth) {
            const isMobAuth = form.authType === 'mobno';
            if (isMobAuth && !form.requireOtp) {
              fieldsHtml += `
                <div class="auth-section" style="margin-bottom: 1.5rem; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 1.25rem;">
                  <label for="input_mobno" style="font-weight: 700; color: var(--theme-color); display:block; margin-bottom:0.4rem;">Mobile Number *</label>
                  <input type="tel" id="input_mobno" maxlength="10" autocomplete="off" placeholder="Enter your registered 10-digit mobile number" required style="width: 100%; height:42px; padding: 0 0.85rem; border: 1.5px solid #ced4da; border-radius: 6px; font-size: 1rem; font-weight:600; background-color: #fff; box-sizing:border-box;" />
                  <div id="info_mobno" style="min-height: 22px; font-size: 0.88rem; margin-top: 0.5rem;"></div>
                </div>
              `;
            } else if (!isMobAuth) {
              fieldsHtml += `
                <div class="auth-section" style="margin-bottom: 1.5rem; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 1.25rem;">
                  <label for="input_cardno" style="font-weight: 700; color: var(--theme-color); display:block; margin-bottom:0.4rem;">Card Number *</label>
                  <input type="text" id="input_cardno" autocomplete="off" placeholder="Enter your card number" required style="width: 100%; height:42px; padding: 0 0.85rem; border: 1.5px solid #ced4da; border-radius: 6px; font-size: 1rem; font-weight:600; background-color: #fff; box-sizing:border-box;" />
                  <div id="info_cardno" style="min-height: 22px; font-size: 0.88rem; margin-top: 0.5rem;"></div>
                </div>
              `;
            }
          }

          page.fields.forEach(f => {
            fieldsHtml += renderField(f);
          });

          const displayStyle = pi === 0 ? 'block' : 'none';

          // Navigation buttons block based on early submission
          let navButtonsHtml = '';
          if (pi > 0) {
            navButtonsHtml += `<button type="button" class="submit-btn btn-back" onclick="goToPage(${pi - 1})" style="background-color:#6c757d; margin-right:0.5rem; width:auto; padding:0.6rem 1.5rem;"><i class="fas fa-arrow-left"></i> Back</button>`;
          }

          const action = page.nextAction;
          if (action === 'submit' || pi === pages.length - 1) {
            navButtonsHtml += `<button type="submit" class="submit-btn" id="submitBtn" style="width:auto; padding:0.6rem 1.5rem;">Submit Response</button>`;
          } else {
            let targetPageIdx = pi + 1;
            if (action !== 'next' && window.pageIndices[action] !== undefined) {
              targetPageIdx = window.pageIndices[action];
            }
            navButtonsHtml += `<button type="button" class="submit-btn btn-next" onclick="validateAndGoToPage(${pi}, ${targetPageIdx})" style="width:auto; padding:0.6rem 1.5rem;">Next <i class="fas fa-arrow-right"></i></button>`;
          }

          pagesHtml += `
            <div class="form-page" id="formPage_${pi}" style="display: ${displayStyle}">
              <div class="form-header">
                <h1>${renderRichText(page.title)}</h1>
                ${page.description ? `<p>${renderRichText(page.description)}</p>` : ''}
              </div>
              <div class="form-body">
                <div id="formAlert_${pi}"></div>
                <form class="page-form" autocomplete="off" onsubmit="submitForm(event)">
                  ${fieldsHtml}
                  <div style="margin-top:2rem; display:flex; justify-content:space-between; align-items:center;">
                    <div>${navButtonsHtml}</div>
                  </div>
                </form>
              </div>
            </div>
          `;
        });

        // Save-progress and email-a-copy are two independent persistent blocks
        // (not tied to one page) so they survive page navigation. Not offered
        // while previewing or while editing an already-submitted response.
        let saveProgressHtml = '';
        const isEditFlow = !!urlParams.get('responseId');
        if (urlParams.get('preview') !== 'true' && !isEditFlow) {
          saveProgressHtml = `
            <div class="save-progress-section" id="saveProgressSection" style="max-width:680px; margin:0 auto 1.25rem auto; background:#fff; border:1px solid #dee2e6; border-radius:8px; padding:1.1rem 1.25rem; box-shadow:0 4px 6px rgba(0,0,0,0.03);">
              <label style="display:flex; align-items:center; gap:0.6rem; font-weight:700; color: var(--theme-color); cursor:pointer; margin:0;">
                <input type="checkbox" id="saveProgressToggle" style="width:auto; margin:0;" />
                Save my progress
              </label>
              <p style="margin:0.35rem 0 0 1.9rem; font-size:0.8rem; color:#6c757d;">If you leave and come back, we'll restore what you've already filled in.</p>
              <div id="draftHintMsg" style="display:none; margin:0.5rem 0 0 1.9rem; font-size:0.8rem; color:#0d6efd;"></div>
              <div id="saveProgressEmailWrap" style="display:none; margin-top:0.75rem;">
                <input type="email" id="saveProgressEmail" autocomplete="off" placeholder="Enter your email address" style="width:100%; padding:0.65rem 0.85rem; border:1px solid #ced4da; border-radius:6px; font-size:0.95rem; background-color:#fafafa;" />
                <div id="draftStatusMsg" style="margin-top:0.5rem; font-size:0.82rem; color:#6c757d; display:none;"></div>
              </div>
            </div>
            <div class="email-copy-section" id="emailCopySection" style="max-width:680px; margin:0 auto 1.25rem auto; background:#fff; border:1px solid #dee2e6; border-radius:8px; padding:1.1rem 1.25rem; box-shadow:0 4px 6px rgba(0,0,0,0.03);">
              <label style="display:flex; align-items:center; gap:0.6rem; font-weight:700; color: var(--theme-color); cursor:pointer; margin:0;">
                <input type="checkbox" id="emailCopyToggle" style="width:auto; margin:0;" />
                Email me a copy of my response
              </label>
              <p style="margin:0.35rem 0 0 1.9rem; font-size:0.8rem; color:#6c757d;">We'll send a copy of your response to this email address after you submit.</p>
              <div id="emailCopyEmailWrap" style="display:none; margin-top:0.75rem;">
                <input type="email" id="emailCopyEmail" autocomplete="off" placeholder="Enter your email address" style="width:100%; padding:0.65rem 0.85rem; border:1px solid #ced4da; border-radius:6px; font-size:0.95rem; background-color:#fafafa;" />
              </div>
            </div>
          `;
        }

        const requiresOtpGate = isAuth && form.authType === 'mobno' && form.requireOtp && !isOtpVerified;

        const otpGateHtml = !form.requireOtp ? '' : `
          <div id="otpGateContainer" style="display: ${requiresOtpGate ? 'block' : 'none'}; max-width:540px; margin:0 auto 2rem auto; background:#fff; border-radius:10px; border:1px solid #dee2e6; box-shadow:0 4px 16px rgba(0,0,0,0.06); padding:2.5rem 2rem; text-align:center;">

      const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let lastRestoredDraftEmail = null;
      let draftSaveTimeout = null;
      // The email a server-side draft actually exists under for this session,

      function showDraftStatusMsg(msg) {

      // Populates form fields from a plain { fieldId: answer } map. Shared by

            // ── Flat Host Guest List Dynamic Handlers ─────────────────────────
      
      function isGuestListField(field) {
        if (!field) return false;
        return field.type === 'guest_list' || field.id === 'guests_list' || field.id === 'guest_list' || (field.label && field.label.toLowerCase().includes('list of guest'));

      let guestLookupTimeouts = {};

      function handleGuestMobileInput(fieldId, idx, inputEl) {
        const val = inputEl.value.trim().replace(/\D/g, '');

        const statusEl = document.getElementById('guest_status_' + fieldId + '_' + idx);
        const cardEl = document.getElementById('guest_card_' + fieldId + '_' + idx);

        statusEl.innerHTML = '<span style="color:#6c757d; font-size:0.82rem;"><i class="fas fa-spinner fa-spin"></i> Checking registration...</span>';

          try {
            const res = await fetch(CONFIG.baseUrl + '/admin/forms/public/' + formData.id + '/validate-guest?mobno=' + val);

            if (data.success && data.data) {
              cardEl.dataset.cardno = data.data.cardno;
              cardEl.dataset.name = data.data.name;
              cardEl.dataset.center = data.data.center || '';

              cardEl.dataset.cardno = '';
              cardEl.dataset.name = '';
              cardEl.dataset.center = '';
              statusEl.innerHTML = '<span style="color:#dc3545; font-weight:600; font-size:0.82rem;"><i class="fas fa-exclamation-circle"></i> ' + escapeHtml(data.message || 'Not registered for this event') + '</span>';
              inputEl.style.borderColor = '#dc3545';

            statusEl.innerHTML = '<span style="color:#dc3545; font-size:0.82rem;">Failed to verify guest registration</span>';

      function selectGuestCapPill(fieldId, val, btnEl) {

        if (btnEl && btnEl.parentElement) {

      function updateGuestListInputs(count, fieldId = 'guests_list') {

            '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">' +
              '<span style="font-weight: 700; color: #204060; font-size: 0.85rem;"><i class="fas fa-user-check" style="color:#28a745;"></i> Guest #' + (i + 1) + '</span>' +
            '</div>' +

              '<input type="tel" maxlength="10" class="guest-mobno-input" id="guest_mobno_' + fieldId + '_' + i + '" placeholder="Enter 10-digit Mobile Number" value="' + escapeAttr(existing.mobno || '') + '" oninput="handleGuestMobileInput(\'' + fieldId + '\', ' + i + ', this)" style="width: 100%; box-sizing: border-box; padding: 0.45rem 0.65rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem;" />' +
            '</div>' +
            '<div id="guest_status_' + fieldId + '_' + i + '" style="margin-top: 0.3rem;">' +
              (existing.name ? '<span style="color:#28a745; font-weight:700; font-size:0.85rem;"><i class="fas fa-check-circle"></i> ' + escapeHtml(existing.name) + ' (' + escapeHtml(existing.center || 'Member') + ') - Confirmed Booking</span>' : '') +

      function populateAnswers(answers) {
        if (!answers || !formData) return;

        formData.fields.forEach(field => {
          const ans = answers[field.id];
          if (ans === undefined || ans === null) return;

          const inputId = `input_${field.id}`;

          if (field.type === 'checkbox') {
            const vals = Array.isArray(ans) ? ans : [ans];
            vals.forEach(v => {
              $(`input[name="${field.id}"][value="${v}"]`).prop('checked', true);
            });
          } else if (field.type === 'radio') {
            $(`input[name="${field.id}"][value="${ans}"]`).prop('checked', true);
                    } else if (field.id === 'guest_capacity_count') {
            const el = document.getElementById(inputId);
            if (el) el.value = ans;
            const valNum = parseInt(ans, 10) || 0;
            document.querySelectorAll('.btn-cap-pill').forEach(b => {
              const bVal = parseInt(b.dataset.capVal, 10);
              if (bVal === valNum) {
                b.classList.add('active');
                b.style.background = '#204060';
                b.style.color = '#fff';
                b.style.borderColor = '#204060';
              } else {
                b.classList.remove('active');
                b.style.background = '#fff';
                b.style.color = '#204060';
                b.style.borderColor = '#ced4da';
              }
            });
            updateGuestListInputs(valNum, 'guests_list');
          } else if (field.type === 'rating') {
            const val = parseInt(ans);
            const parent = $(`.star-rating[data-id="${field.id}"]`);
            parent.find('.input-rating-val').val(val);
            parent.find('.star').each(function() {
              if ($(this).data('val') <= val) {
                $(this).addClass('selected');
              }
            });
          } else if (field.type === 'grid_radio') {
            const gridAns = ans || {};
            field.rows.forEach((r, ri) => {
              const rowVal = gridAns[r];
              if (rowVal) {
                $(`input[name="response_${field.id}_${ri}"][value="${rowVal}"]`).prop('checked', true);
              }
            });
          } else if (field.type === 'grid_checkbox') {
            const gridAns = ans || {};
            field.rows.forEach((r, ri) => {
              const rowVals = gridAns[r] || [];
              rowVals.forEach(v => {
                $(`input[name="response_${field.id}_${ri}"][value="${v}"]`).prop('checked', true);
              });
            });
                    } else if (isGuestListField(field)) {
            const list = Array.isArray(ans) ? ans : [];
            const guestCountEl = document.getElementById('input_guest_capacity_count');
            const countToRender = list.length > 0 ? list.length : (guestCountEl ? parseInt(guestCountEl.value, 10) || 0 : 0);
            if (guestCountEl && list.length > 0) {
              guestCountEl.value = list.length;
            }
            updateGuestListInputs(countToRender, field.id);
            const container = document.getElementById(`guestListContainer_${field.id}`);
            if (container) {
              list.forEach((g, idx) => {
                const card = document.getElementById(`guest_card_${field.id}_${idx}`);
                const mobInput = document.getElementById(`guest_mobno_${field.id}_${idx}`);
                const statusEl = document.getElementById(`guest_status_${field.id}_${idx}`);
                if (card && mobInput) {
                  mobInput.value = g.mobno || '';
                  card.dataset.cardno = g.cardno || '';
                  card.dataset.name = g.name || '';
                  card.dataset.center = g.center || '';
                  if (statusEl && g.name) {
                    statusEl.innerHTML = `<span style="color:#28a745; font-weight:700; font-size:0.85rem;"><i class="fas fa-check-circle"></i> ${escapeHtml(g.name)} (${escapeHtml(g.center || 'Member')}) - Confirmed Booking</span>`;
                    mobInput.style.borderColor = '#28a745';
                  }
                }
              });
            }
          } else if (field.type === 'grid_number') {
            const gridAns = ans || {};
            (field.rows || []).forEach((r, ri) => {
              const rowObj = gridAns[r] || {};
              (field.columns || []).forEach((c, ci) => {
                const input = document.querySelector(`input[name="response_${field.id}_${ri}_${ci}"]`);
                if (input) {
                  const val = typeof rowObj === 'object' ? (rowObj[c] !== undefined ? rowObj[c] : '') : rowObj;
                  input.value = (val !== null && val !== undefined && val !== '') ? val : '0';
                }
              });
            });
          } else {
            const el = document.getElementById(inputId);
            if (el) el.value = ans;
          }
        });

        evaluateLogic();
      }

      // Fetches a previously saved in-progress draft (opt-in, keyed by email)
      // and restores it into the form if one exists.
      async function attemptRestoreDraft(email) {
        if (!email || !formData || urlParams.get('preview') === 'true' || urlParams.get('responseId')) return;
        const normalized = email.trim().toLowerCase();
        if (!EMAIL_REGEX.test(normalized) || normalized === lastRestoredDraftEmail) return;
        lastRestoredDraftEmail = normalized;

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}/draft?email=${encodeURIComponent(normalized)}`);
          const data = await res.json();
          const hasRealAnswers = data.data && data.data.responses &&
            Object.values(data.data.responses).some(v => Array.isArray(v) ? v.length > 0 : (v !== '' && v !== null && v !== undefined));
          if (data.success && hasRealAnswers) {
            sessionDraftEmail = normalized;
            populateAnswers(data.data.responses);

            // Proving identity via email is itself the confirmation needed to
            // also restore the mobile/card number field — so it doesn't have
            // to be retyped separately. Re-run the same resolve it would get
            // from typing it, to show the "Registered to..." confirmation.
            const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
            if (authInput && !authInput.value.trim()) {
              const restoredNumber = authInput.id === 'input_mobno' ? data.data.mobno : data.data.cardno;
              if (restoredNumber) {
                authInput.value = restoredNumber;
                checkAuthInputValidation(authInput);
              }
            }

            const when = data.data.updatedAt ? new Date(data.data.updatedAt).toLocaleString() : '';
            const toggle = document.getElementById('saveProgressToggle');
            const wrap = document.getElementById('saveProgressEmailWrap');
            if (toggle) toggle.checked = true;
            if (wrap) wrap.style.display = 'block';
            const hintEl = document.getElementById('draftHintMsg');
            if (hintEl) hintEl.style.display = 'none';
            showDraftStatusMsg(`We restored your saved progress${when ? ` from ${when}` : ''}.`);
          }
        } catch (err) {
          console.error('Failed to restore saved draft:', err);
        }
      }

      // Debounced autosave of an in-progress draft — no-ops unless the user
      // has opted in via the "save my progress" checkbox with a valid email.
      function scheduleDraftSave() {
        if (!formData || urlParams.get('preview') === 'true' || urlParams.get('responseId')) return;
        const toggle = document.getElementById('saveProgressToggle');
        if (!toggle || !toggle.checked) return;
        const emailInput = document.getElementById('saveProgressEmail');
        const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
        if (!EMAIL_REGEX.test(email)) return;

        clearTimeout(draftSaveTimeout);
        draftSaveTimeout = setTimeout(async () => {
          try {
            const responses = collectResponses();
            const cardno = document.getElementById('input_cardno')?.value?.trim() || null;
            const mobno = document.getElementById('input_mobno')?.value?.trim() || null;
            const saveRes = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}/draft`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, cardno, mobno, responses })
            });
            if (!saveRes.ok) throw new Error(`Draft save failed with status ${saveRes.status}`);
            sessionDraftEmail = email;
            // Only remember a non-identifying flag — never the email itself —
            // so a later visitor on this device sees just a generic "you may
            // have a draft" hint, never who saved it or what they entered.
            localStorage.setItem(`form_has_draft_${formId}`, 'true');
            showDraftStatusMsg('Progress saved.');
          } catch (err) {
            console.error('Failed to save draft:', err);
          }
        }, 1000);
      }

      $(document).on('change', '#saveProgressToggle', function() {
        const wrap = document.getElementById('saveProgressEmailWrap');
        if (this.checked) {
          wrap.style.display = 'block';
          const hintEl = document.getElementById('draftHintMsg');
          if (hintEl) hintEl.style.display = 'none';
          const email = document.getElementById('saveProgressEmail').value.trim();
          if (EMAIL_REGEX.test(email)) {
            attemptRestoreDraft(email);
          }
        } else {
          wrap.style.display = 'none';
        }
      });

      $(document).on('blur', '#saveProgressEmail', function() {
        const toggle = document.getElementById('saveProgressToggle');
        if (!toggle || !toggle.checked) return;
        if (EMAIL_REGEX.test(this.value.trim())) {
          attemptRestoreDraft(this.value.trim());
        }
      });

      function goToPage(pageIdx) {
        $(`.form-page`).hide();
        $(`#formPage_${pageIdx}`).show();
        window.currentPageIdx = pageIdx;
        
        if (document.getElementById('progressBar')) {
          const pct = ((pageIdx + 1) / window.totalPagesCount) * 100;
          document.getElementById('progressBar').style.width = `${pct}%`;
          document.getElementById('progressText').textContent = `Page ${pageIdx + 1} of ${window.totalPagesCount}`;
        }

      function validateFieldInput(field, value, checkedCount) {
        if (!field.validation) {
          return { isValid: true };
        }

        const val = field.validation;
        const rule = val.rule || val.type;
        if (!rule) {
          return { isValid: true };
        }

        const errorMsg = val.errorMsg || 'Invalid value';
        const isEmpty = (value === '' || value === null || value === undefined);

        if (!field.required && isEmpty && !['checkbox_limit', 'select_at_least', 'select_at_most', 'select_exactly'].includes(rule)) {
          return { isValid: true };
        }

        // --- 1. NUMBER RULES ---
        if (['greater_than', 'greater_than_or_equal', 'less_than', 'less_than_or_equal', 'equal', 'not_equal', 'between', 'not_between', 'is_number', 'whole_number', 'number_check', 'range', 'ten_digit'].includes(rule)) {
          const num = parseFloat(value);
          if (isNaN(num) || value.trim() === '') {
            return { isValid: false, errorMsg: errorMsg || 'Must be a valid number' };
          }

          const targetVal = val.value ? parseFloat(val.value) : undefined;

          switch (rule) {
            case 'greater_than':
              if (targetVal !== undefined && !(num > targetVal)) return { isValid: false, errorMsg };
              break;
            case 'greater_than_or_equal':
              if (targetVal !== undefined && !(num >= targetVal)) return { isValid: false, errorMsg };
              break;
            case 'less_than':
              if (targetVal !== undefined && !(num < targetVal)) return { isValid: false, errorMsg };
              break;
            case 'less_than_or_equal':
              if (targetVal !== undefined && !(num <= targetVal)) return { isValid: false, errorMsg };
              break;
            case 'equal':
              if (targetVal !== undefined && num !== targetVal) return { isValid: false, errorMsg };
              break;
            case 'not_equal':
              if (targetVal !== undefined && num === targetVal) return { isValid: false, errorMsg };
              break;
            case 'between':
              const minBetween = val.min ? parseFloat(val.min) : undefined;
              const maxBetween = val.max ? parseFloat(val.max) : undefined;
              if (minBetween !== undefined && maxBetween !== undefined) {
                if (num < minBetween || num > maxBetween) return { isValid: false, errorMsg };
              }
              break;
            case 'not_between':
              const minNotBetween = val.min ? parseFloat(val.min) : undefined;
              const maxNotBetween = val.max ? parseFloat(val.max) : undefined;
              if (minNotBetween !== undefined && maxNotBetween !== undefined) {
                if (num >= minNotBetween && num <= maxNotBetween) return { isValid: false, errorMsg };
              }
              break;
            case 'is_number':
            case 'number_check':
              break;
            case 'whole_number':
              if (!Number.isInteger(num)) return { isValid: false, errorMsg };
              break;
            case 'ten_digit':
              const cleanNum = value.trim().replace(/\D/g, '');
              if (cleanNum.length !== 10) return { isValid: false, errorMsg: errorMsg || 'Must be a 10-digit number' };
              break;
            case 'range':
              if (val.min && num < parseFloat(val.min)) return { isValid: false, errorMsg };
              if (val.max && num > parseFloat(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 2. TEXT RULES ---
        else if (['contains', 'does_not_contain', 'email', 'url'].includes(rule) && val.category === 'text') {
          const strVal = String(value);
          switch (rule) {
            case 'contains':
              if (val.value && !strVal.includes(val.value)) return { isValid: false, errorMsg };
              break;
            case 'does_not_contain':
              if (val.value && strVal.includes(val.value)) return { isValid: false, errorMsg };
              break;
            case 'email':
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
              if (!emailRegex.test(strVal)) return { isValid: false, errorMsg };
              break;
            case 'url':
              const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
              if (!urlRegex.test(strVal)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 3. LENGTH RULES ---
        else if (['max_char_count', 'min_char_count', 'length'].includes(rule)) {
          const len = value.length;
          switch (rule) {
            case 'max_char_count':
              if (val.value && len > parseInt(val.value)) return { isValid: false, errorMsg };
              break;
            case 'min_char_count':
              if (val.value && len < parseInt(val.value)) return { isValid: false, errorMsg };
              break;
            case 'length':
              if (val.min && len < parseInt(val.min)) return { isValid: false, errorMsg };
              if (val.max && len > parseInt(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 4. REGULAR EXPRESSION RULES ---
        else if (['contains', 'does_not_contain', 'matches', 'does_not_match', 'regex'].includes(rule)) {
          const strVal = String(value);
          const pattern = val.value || val.pattern;
          if (pattern) {
            try {
              let finalPattern = pattern;
              if (rule === 'matches' || rule === 'does_not_match') {
                if (!finalPattern.startsWith('^')) finalPattern = '^' + finalPattern;
                if (!finalPattern.endsWith('$')) finalPattern = finalPattern + '$';
              }
              const rx = new RegExp(finalPattern);
              const isMatch = rx.test(strVal);

              if ((rule === 'contains' || rule === 'matches' || rule === 'regex') && !isMatch) {
                return { isValid: false, errorMsg };
              }
              if ((rule === 'does_not_contain' || rule === 'does_not_match') && isMatch) {
                return { isValid: false, errorMsg };
              }
            } catch (e) {
              console.error("Invalid regex pattern validation:", e);
            }
          }
        }

        // --- 5. CHECKBOX CHOICE LIMIT RULES ---
        else if (['select_at_least', 'select_at_most', 'select_exactly', 'checkbox_limit'].includes(rule)) {
          const count = parseInt(checkedCount || 0);
          if (!field.required && count === 0) return { isValid: true };

          const targetNum = val.value ? parseInt(val.value) : undefined;

          switch (rule) {
            case 'select_at_least':
              if (targetNum !== undefined && count < targetNum) return { isValid: false, errorMsg };
              break;
            case 'select_at_most':
              if (targetNum !== undefined && count > targetNum) return { isValid: false, errorMsg };
              break;
            case 'select_exactly':
              if (targetNum !== undefined && count !== targetNum) return { isValid: false, errorMsg };
              break;
            case 'checkbox_limit':
              if (val.min && count < parseInt(val.min)) return { isValid: false, errorMsg };
              if (val.max && count > parseInt(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 6. DATE RANGE RULES ---
        else if (rule === 'date_range') {
          const dateVal = new Date(value);
          if (isNaN(dateVal.getTime())) return { isValid: false, errorMsg: 'Must be a valid date' };
          if (val.min && dateVal < new Date(val.min)) return { isValid: false, errorMsg };
          if (val.max && dateVal > new Date(val.max)) return { isValid: false, errorMsg };
        }

        return { isValid: true };
      }

      function showInlineError(fid, msg) {
        const errorEl = document.getElementById(`error_${fid}`);
        if (errorEl) {
          $(errorEl).find('span').text(msg);
          $(errorEl).show();
        }
      }

      function clearInlineError(fid) {
        const errorEl = document.getElementById(`error_${fid}`);
        if (errorEl) {
          $(errorEl).hide();
        }
      }

      // Lets the user click a grid column header once to apply that answer to
      // every row, instead of clicking each row individually — the main
      // click-reduction for multi-day Accommodation/Food grids. For checkbox
      // grids this toggles: if every row already has that column checked, it
      // clears them all; otherwise it checks them all.
      function applyNumberToAllRows(fieldId, colIndex, value) {
        const cleanVal = (value === '' || value === null || value === undefined) ? '' : String(Math.max(0, parseInt(value, 10) || 0));
        const inputs = document.querySelectorAll(`.grid-number-cell[data-field-id="${fieldId}"][data-col-index="${colIndex}"]`);
        inputs.forEach(input => {
          input.value = cleanVal;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        });
      }

      function applyColumnToAllRows(fieldId, colIndex, isRadio) {
        const inputs = document.querySelectorAll(`input[data-field-id="${fieldId}"][data-col-index="${colIndex}"]`);
        if (inputs.length === 0) return;

        if (isRadio) {
          inputs.forEach(input => {
            input.checked = true;
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
        } else {
          const allChecked = Array.from(inputs).every(input => input.checked);
          inputs.forEach(input => {
            input.checked = !allChecked;
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
        }
      }

      function checkFieldValidation(group) {
        const fid = $(group).data('field-id');
        const field = formData.fields.find(f => f.id === fid);
        if (!field) return { isValid: true };

        const inputs = $(group).find('input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="tel"], select, textarea');

        let answerVal = null;
        let checkedCount = 0;
        if (field.type === 'checkbox') {
          const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
          answerVal = Array.from(checked).map(c => c.value);
          checkedCount = checked.length;
        } else if (field.type === 'radio') {
          const selected = document.querySelector(`input[name="${field.id}"]:checked`);
          answerVal = selected ? selected.value : '';
        } else if (field.type === 'grid_radio') {
          if (field.dynamicRows === 'utsav' && field.noActiveUtsav && field.required) {
            const errMsg = 'This section is unavailable because no upcoming event is currently configured.';
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          }
          const selectedCols = [];
          let hasSelectionError = false;
          let errMsg = '';
          field.rows.forEach((r, ri) => {
            const checked = document.querySelector(`input[name="response_${field.id}_${ri}"]:checked`);
            if (field.required && !checked) {
              hasSelectionError = true;
              errMsg = `Please select an option for each row`;
            }
            if (checked) {
              selectedCols.push(checked.value);
            }
          });

          if (!hasSelectionError && field.limitOnePerColumn) {
            const uniqueCols = new Set(selectedCols);
            if (uniqueCols.size < selectedCols.length) {
              hasSelectionError = true;
              errMsg = `Please select a unique option per column (limit to one per column)`;
            }
          }
          if (hasSelectionError) {
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          } else {
            clearInlineError(field.id);
            return { isValid: true };
          }
        } else if (field.type === 'grid_checkbox') {
          if (field.dynamicRows === 'utsav' && field.noActiveUtsav && field.required) {
            const errMsg = 'This section is unavailable because no upcoming event is currently configured.';
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          }
          let hasSelectionError = false;
          let errMsg = '';
          field.rows.forEach((r, ri) => {
            const checked = document.querySelectorAll(`input[name="response_${field.id}_${ri}"]:checked`);
            if (field.required && checked.length === 0) {
              hasSelectionError = true;
              errMsg = `Please select at least one checkbox for each row`;
            }
          });
          if (hasSelectionError) {
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          } else {
            clearInlineError(field.id);
            return { isValid: true };
          }
        } else if (field.type === 'grid_number') {
          let hasEmpty = false;
          let hasNegative = false;
          (field.rows || []).forEach((r, ri) => {
            (field.columns || []).forEach((c, ci) => {
              const input = document.querySelector(`input[name="response_${field.id}_${ri}_${ci}"]`);
              if (input) {
                const val = input.value.trim();
                if (val === '') {
                  hasEmpty = true;
                } else if (parseInt(val, 10) < 0) {
                  hasNegative = true;
                }
              }
            });
          });

          if (hasNegative) {
            const errMsg = 'Counts cannot be negative';
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          }
          if (field.required && hasEmpty) {
            const errMsg = 'Please enter a number for each date';
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          }
          clearInlineError(field.id);
          return { isValid: true };
        } else if (isGuestListField(field)) {
          const guestCapEl = document.getElementById('input_guest_capacity_count');
          const count = guestCapEl ? parseInt(guestCapEl.value, 10) || 0 : 0;
          if (count > 0) {
            const container = document.getElementById(`guestListContainer_${field.id}`);
            let missingOrInvalid = false;
            let missingIndex = -1;
            if (!container) {
              missingOrInvalid = true;
            } else {
              for (let i = 0; i < count; i++) {
                const card = document.getElementById(`guest_card_${field.id}_${i}`);
                const mobInput = document.getElementById(`guest_mobno_${field.id}_${i}`);
                const cardno = card ? card.dataset.cardno : '';
                const val = mobInput ? mobInput.value.trim() : '';
                if (!val || val.length !== 10 || !cardno) {
                  missingOrInvalid = true;
                  missingIndex = i + 1;
                  if (mobInput) mobInput.style.borderColor = '#dc3545';
                  break;
                }
              }
            }

            if (missingOrInvalid) {
              const msg = missingIndex > 0 
                ? `Please provide a verified mobile number for Guest #${missingIndex}` 
                : `Please provide verified mobile numbers for all ${count} guest(s)`;
              showInlineError(field.id, msg);
              return { isValid: false, errorMsg: msg };
            }
          }
          clearInlineError(field.id);
          return { isValid: true };
        } else {
          const el = document.getElementById(`input_${field.id}`);
          answerVal = el ? el.value.trim() : '';
        }

        // 1. Required Check
        if (field.required) {
          if (answerVal === '' || answerVal === null || answerVal === undefined || (Array.isArray(answerVal) && answerVal.length === 0)) {
            const msg = `This field is required`;
            showInlineError(field.id, msg);
            inputs.css('border-color', '#dc3545');
            return { isValid: false, errorMsg: msg };
          }
        } else {
          // If not required and empty, skip rule validation
          const isEmpty = (answerVal === '' || answerVal === null || answerVal === undefined || (Array.isArray(answerVal) && answerVal.length === 0));
          if (isEmpty) {
            clearInlineError(field.id);
            inputs.css('border-color', '#ced4da');
            return { isValid: true };
          }
        }

        // 2. Custom Rule Check
        if (field.validation) {
          const valCheck = validateFieldInput(field, answerVal, checkedCount);
          if (!valCheck.isValid) {
            showInlineError(field.id, valCheck.errorMsg);
            inputs.css('border-color', '#dc3545');
            return { isValid: false, errorMsg: valCheck.errorMsg };
          }
        }

      // 3. Email Type Check
      if (field.type === 'email' && answerVal) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(answerVal)) {
          const msg = `Must be a valid email address`;
          showInlineError(field.id, msg);
          inputs.css('border-color', '#dc3545');
          return { isValid: false, errorMsg: msg };
        }
      }

      // 4. Phone Type Check
      if (field.type === 'phone' && answerVal) {
        const cleanNum = answerVal.replace(/\D/g, '');
        if (cleanNum.length !== 10) {
          const msg = `Must be a 10-digit phone number`;
          showInlineError(field.id, msg);
          inputs.css('border-color', '#dc3545');
          return { isValid: false, errorMsg: msg };
        }
      }

        // Date constraints check
        if (field.type === 'date' && answerVal) {
          const dateConstraints = field.dateConstraints;
          if (dateConstraints) {
            const chosenDate = new Date(answerVal);
            const getLocalDateString = (d) => {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              return `${year}-${month}-${day}`;
            };
            const chosenStr = getLocalDateString(chosenDate);
            const today = new Date();
            const todayStr = getLocalDateString(today);

            let minDateStr = null;
            if (dateConstraints.minType === 'today') {
              minDateStr = todayStr;
            } else if (dateConstraints.minType === 'tomorrow') {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              minDateStr = getLocalDateString(tomorrow);
            } else if (dateConstraints.minType === 'fixed' && dateConstraints.minFixed) {
              minDateStr = dateConstraints.minFixed;
            }

            // Once date settings exist for a field, never allow a date before today,
            // regardless of the configured minType (including "no minimum" or a past fixed date).
            if (!minDateStr || minDateStr < todayStr) {
              minDateStr = todayStr;
            }

            if (minDateStr && chosenStr < minDateStr) {
              const msg = `Date must be on or after ${minDateStr}`;
              showInlineError(field.id, msg);
              inputs.css('border-color', '#dc3545');
              return { isValid: false, errorMsg: msg };
            }

            let maxDateStr = null;
            if (dateConstraints.maxType === 'today') {
              maxDateStr = todayStr;
            } else if (dateConstraints.maxType === 'fixed' && dateConstraints.maxFixed) {
              maxDateStr = dateConstraints.maxFixed;
            }

            if (maxDateStr && chosenStr > maxDateStr) {
              const msg = `Date must be on or before ${maxDateStr}`;
              showInlineError(field.id, msg);
              inputs.css('border-color', '#dc3545');
              return { isValid: false, errorMsg: msg };
            }

            if (dateConstraints.cutoffHour !== null && dateConstraints.cutoffHour !== undefined) {
              const now = new Date();
              const nowStr = getLocalDateString(now);
              const cutoffDay = new Date(chosenStr);
              cutoffDay.setDate(cutoffDay.getDate() - 1);
              const cutoffDayStr = getLocalDateString(cutoffDay);

              const currentHour = now.getHours();
              if (nowStr > cutoffDayStr || (nowStr === cutoffDayStr && currentHour >= dateConstraints.cutoffHour)) {
                const msg = `Booking/Selection for ${chosenStr} has closed (Cutoff was ${dateConstraints.cutoffHour}:00 of previous day)`;
                showInlineError(field.id, msg);
                inputs.css('border-color', '#dc3545');
                return { isValid: false, errorMsg: msg };
              }
            }
          }
        }

        // Valid
        clearInlineError(field.id);
        inputs.css('border-color', '#ced4da');
        return { isValid: true };
      }

      let isOtpVerified = urlParams.get('responseId') ? true : false;
      let lastCheckedAuthVal = '';
      let lookupTimeout = null;
      window.isAuthVerified = false;
      window.previousResponseId = null;
      window.lastAuthErrorMessage = '';

      // ── Date helpers for grid pre-fill and past-date locking ──────────
      function normalizeDateLabel(dateKey) {
        if (!dateKey) return null;
        const trimmed = String(dateKey).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
        const match = trimmed.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)(?:\s+(\d{4}))?$/i);
        if (match) {
          const day = String(parseInt(match[1], 10)).padStart(2, '0');
          const monthName = match[2].toLowerCase().substring(0, 3);
          const year = match[3] || new Date().getFullYear();
          const months = { jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12' };
          const m = months[monthName];
          if (m) return `${year}-${m}-${day}`;
        }
        return null;
      }

      function getTodayIST() {
        return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      }

      function disablePastDateRows() {
        const today = getTodayIST();
        document.querySelectorAll('.grid-table tbody tr').forEach(tr => {
          const rowLabel = tr.querySelector('td')?.textContent?.trim();
          if (!rowLabel) return;
          const normalized = normalizeDateLabel(rowLabel);
          if (normalized && normalized < today) {
            tr.style.opacity = '0.5';
            tr.style.pointerEvents = 'none';
            tr.querySelectorAll('input').forEach(inp => { inp.disabled = true; });
            const firstTd = tr.querySelector('td');
            if (firstTd && !firstTd.textContent.includes('(Past)')) {
              firstTd.innerHTML += ' <span style="font-size:0.75rem; color:#6c757d; font-weight:400;">(Past)</span>';
            }
          }
        });
      }

      function prefillPreviousResponse(prevData) {
        const prevResponses = prevData.responses || {};
        const submittedDate = prevData.submittedAt ? new Date(prevData.submittedAt).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric' }) : '';

        // Show warning banner
        const currentPageIdx = window.currentPageIdx || 0;
        const alertContainer = document.getElementById(`formAlert_${currentPageIdx}`);
        if (alertContainer) {
          alertContainer.className = 'alert-warning';
          alertContainer.innerHTML = `<i class="fas fa-info-circle"></i> You submitted earlier${submittedDate ? ' on ' + submittedDate : ''}. Your previous choices are shown below. You can update future dates only.`;
          alertContainer.style.display = 'block';
          alertContainer.style.background = '#fff3cd';
          alertContainer.style.color = '#856404';
          alertContainer.style.border = '1px solid #ffeeba';
          alertContainer.style.borderRadius = '6px';
          alertContainer.style.padding = '0.75rem 1rem';
          alertContainer.style.marginBottom = '1rem';
          alertContainer.style.fontWeight = '600';
          alertContainer.style.fontSize = '0.9rem';
        }

        // Pre-fill all fields (grid_number, grid_radio, select, text, rating, etc.)
        populateAnswers(prevResponses);

        // Disable past date rows
        disablePastDateRows();
      }

      
      // Switch pre-fill when department changes for multi-department heads
      async function handleDepartmentChange(deptVal) {
        if (!formData || !deptVal) return;
        const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
        if (!authInput) return;
        const val = authInput.value.trim();
        const type = authInput.id === 'input_mobno' ? 'mobno' : 'cardno';

        try {
          const prevRes = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formData.id}/my-response?type=${type}&value=${encodeURIComponent(val)}&department=${encodeURIComponent(deptVal)}`);
          const prevData = await prevRes.json();
          if (prevData.success && prevData.data) {
            window.previousResponseId = prevData.data.responseId;
            prefillPreviousResponse(prevData.data);
          } else {
            window.previousResponseId = null;
            resetGridInputs();
            const currentPageIdx = window.currentPageIdx || 0;
            const alertContainer = document.getElementById(`formAlert_${currentPageIdx}`);
            if (alertContainer) alertContainer.style.display = 'none';
            disablePastDateRows();
          }
        } catch (err) {
          console.warn('Error fetching response for department:', err);
        }
      }

      function resetGridInputs() {
        document.querySelectorAll('.grid-table tbody input[type="number"]').forEach(inp => {
          if (!inp.disabled) inp.value = '0';
        });
        document.querySelectorAll('.grid-table tbody input[type="radio"], .grid-table tbody input[type="checkbox"]').forEach(inp => {
          if (!inp.disabled) inp.checked = false;
        });
      }

      async function performAuthLookup(inputEl) {
        if (!inputEl) return false;
        const id = $(inputEl).attr('id');
        const val = inputEl.value.trim();
        const isMob = id === 'input_mobno';
        const errorId = isMob ? 'mobno' : 'cardno';
        const infoEl = document.getElementById(`info_${errorId}`);

        if (!val) {
          if (infoEl) infoEl.innerHTML = `<span style="color:#dc3545;"><i class="fas fa-exclamation-circle"></i> ${isMob ? 'Mobile Number' : 'Card Number'} is required</span>`;
          $(inputEl).css('border-color', '#dc3545');
          window.isAuthVerified = false;
          window.lastAuthErrorMessage = `${isMob ? 'Mobile Number' : 'Card Number'} is required`;
          return false;
        }

        if (isMob) {
          const clean = val.replace(/\D/g, '');
          if (clean.length !== 10) {
            if (infoEl) infoEl.innerHTML = '<span style="color:#dc3545;"><i class="fas fa-exclamation-circle"></i> Mobile Number must be 10 digits</span>';
            $(inputEl).css('border-color', '#dc3545');
            window.isAuthVerified = false;
            window.lastAuthErrorMessage = 'Mobile Number must be 10 digits';
            return false;
          }
        }

        if (infoEl) {
          infoEl.innerHTML = '<span style="color:#6c757d;"><i class="fas fa-spinner fa-spin"></i> Checking registration...</span>';
        }

        try {
          const type = isMob ? 'mobno' : 'cardno';
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/resolve-identity?type=${type}&value=${encodeURIComponent(val)}&formId=${formData.id}`);
          const data = await res.json();
          
          window.isAuthVerified = data.success;
          window.lastAuthErrorMessage = data.message || '';

          if (data.success) {
            $(inputEl).css('border-color', '#28a745');
            if (infoEl) {
              infoEl.innerHTML = `<span style="color:#28a745; font-weight:700; display:flex; align-items:center; gap:0.3rem;"><i class="fas fa-check-circle"></i> Registered to: ${escapeHtml(data.data.name)} (${escapeHtml(data.data.center || 'Ashram Member')})</span>`;
            }

            const deptField = (formData.fields || []).find(f => f.vendorRole === 'department' || f.id === 'name_of_department' || (f.label || '').toLowerCase().includes('department'));
            if (deptField) {
              const deptEl = document.getElementById(`input_${deptField.id}`);
              if (deptEl && !deptEl.dataset.hasDeptListener) {
                deptEl.dataset.hasDeptListener = 'true';
                deptEl.addEventListener('change', (e) => {
                  handleDepartmentChange(e.target.value);
                });
              }
              if (data.data.department && deptEl && !deptEl.value) {
                deptEl.value = data.data.department;
              }
            }

            // Auto-populate flat info for Flat Host forms
            if (data.data.flatno) {
              const flatEl = document.getElementById('input_flatno');
              if (flatEl) {
                flatEl.value = data.data.flatno;
                flatEl.readOnly = true;
                flatEl.style.backgroundColor = '#e9ecef';
              }
              const resCountEl = document.getElementById('input_permanent_residents_count');
              if (resCountEl) {
                resCountEl.value = data.data.confirmed_residents_count !== undefined ? data.data.confirmed_residents_count : 1;
                resCountEl.readOnly = true;
                resCountEl.style.backgroundColor = '#e9ecef';
              }
              if (infoEl) {
                infoEl.innerHTML += `<div style="color:#204060; font-size:0.85rem; font-weight:700; margin-top:0.25rem;"><i class="fas fa-building"></i> Flat No: ${escapeHtml(data.data.flatno)} • ${data.data.confirmed_residents_count} Confirmed Resident(s) Attending</div>`;
              }
            }

            // Attach listener to guest capacity field if present
            const guestCapEl = document.getElementById('input_guest_capacity_count');
            if (guestCapEl && !guestCapEl.dataset.hasCapListener) {
              guestCapEl.dataset.hasCapListener = 'true';
              guestCapEl.addEventListener('input', (e) => {
                updateGuestListInputs(e.target.value, 'guests_list');
              });
              guestCapEl.addEventListener('change', (e) => {
                updateGuestListInputs(e.target.value, 'guests_list');
              });
            }

            // Fetch previous response to pre-fill form and disable past dates (ONLY once per unique auth input, not on submit re-validation)
            if (window.lastPrefilledAuthValue !== val) {
              window.lastPrefilledAuthValue = val;
              try {
                const flatnoParam = data.data.flatno ? `&flatno=${encodeURIComponent(data.data.flatno)}` : '';
                const prevRes = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formData.id}/my-response?type=${type}&value=${encodeURIComponent(val)}${flatnoParam}`);
                const prevData = await prevRes.json();
                if (prevData.success && prevData.data) {
                  window.previousResponseId = prevData.data.responseId;
                  prefillPreviousResponse(prevData.data);
                } else {
                  window.previousResponseId = null;
                  disablePastDateRows();
                }
              } catch (prevErr) {
                console.warn('Could not fetch previous response:', prevErr);
                disablePastDateRows();
              }
            }

            return true;
          } else {
            $(inputEl).css('border-color', '#dc3545');
            if (infoEl) {
              infoEl.innerHTML = `<span style="color:#dc3545; font-weight:600;"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(data.message || 'Not registered')}</span>`;
            }
            return false;
          }
        } catch (err) {
          console.error('Error checking registration:', err);
          if (infoEl) infoEl.innerHTML = '';
          return false;
        }
      }

      function checkAuthInputValidation(inputEl) {
        clearTimeout(lookupTimeout);
        lookupTimeout = setTimeout(() => {
          performAuthLookup(inputEl);
        }, 200);
        return true;
      }

      async function validateAndGoToPage(from, to) {
        const pageContainer = document.getElementById(`formPage_${from}`);
        
        let isValid = true;
        let firstInvalidMsg = '';

        if (from === 0 && !formData.isPublic) {
          const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
          if (authInput) {
            const authOk = await performAuthLookup(authInput);
            if (!authOk || window.isAuthVerified === false) {
              isValid = false;
              firstInvalidMsg = window.lastAuthErrorMessage || (document.getElementById('input_mobno') ? 'Please enter a valid registered mobile number' : 'Please enter a valid card number');
            } else if (formData.requireOtp && authInput.id === 'input_mobno' && !isOtpVerified) {
              isValid = false;
              firstInvalidMsg = 'Please verify your mobile number using OTP first';
            }
          }
        }

        const visibleGroups = $(pageContainer).find('.field-group:visible');
        visibleGroups.each(function() {
          const check = checkFieldValidation(this);
          if (!check.isValid) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = check.errorMsg;
          }
        });

        if (!isValid) {
          showFormAlertOnPage(from, firstInvalidMsg || 'Please correct the errors in the form', 'danger');
          return;
        }

        // Clear general alert if valid
        const alert = document.getElementById(`formAlert_${from}`);
        if (alert) alert.style.display = 'none';

        goToPage(to);
      }

        const alert = document.getElementById(`formAlert_${pageIdx}`);
        if (!alert) return;
        alert.className = `alert-${type}`;
        alert.textContent = msg;
        alert.style.display = 'block';
        window.scrollTo({ top: alert.offsetTop - 50, behavior: 'smooth' });
      }

            const today = new Date();
            const getLocalDateString = (d) => {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              return `${year}-${month}-${day}`;
            };
            const todayStr = getLocalDateString(today);
            let computedMin = null;
            if (field.dateConstraints.minType === 'today') {
              computedMin = todayStr;
            } else if (field.dateConstraints.minType === 'tomorrow') {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              computedMin = getLocalDateString(tomorrow);
            } else if (field.dateConstraints.minType === 'fixed' && field.dateConstraints.minFixed) {
              computedMin = field.dateConstraints.minFixed;
            }
            // Once date settings exist for a field, never allow picking a date before today,
            // regardless of the configured minType (including "no minimum" or a past fixed date).
            if (!computedMin || computedMin < todayStr) {

            if (field.dateConstraints.maxType === 'today') {
