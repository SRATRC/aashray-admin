      function evaluateLogic() {
        if (!formData || !formData.fields) return;

        formData.fields.forEach(field => {
          let hasLogic = false;
          let show = true;

          // Support conditions array format
          if (field.conditions && Array.isArray(field.conditions) && field.conditions.length > 0) {
            hasLogic = true;
            show = field.conditions.every(cond => {
              const depField = formData.fields.find(f => f.id === cond.fieldId);
              if (!depField) return true;
              
              const currentVal = getFieldValue(depField);
              const targetVal = cond.value;
              const op = cond.operator || 'equals';

              if (op === 'equals') {
                if (Array.isArray(currentVal)) return currentVal.includes(targetVal);
                return String(currentVal) === String(targetVal);
              } else if (op === 'not_equals') {
                if (Array.isArray(currentVal)) return !currentVal.includes(targetVal);
                return String(currentVal) !== String(targetVal);
              } else if (op === 'contains') {
                const currentStr = Array.isArray(currentVal) ? currentVal.join(',') : String(currentVal);
                return currentStr.toLowerCase().includes(targetVal.toLowerCase());
              }
              return true;
            });
          } 
          // Backward compatibility for old single condition logic format
          else if (field.logic) {
            hasLogic = true;
            const dependsOn = field.logic.dependsOn;
            const targetVal = field.logic.value;
            const op = field.logic.operator || 'equals';
            const depField = formData.fields.find(f => f.id === dependsOn);

            if (depField) {
              const currentVal = getFieldValue(depField);
              if (op === 'equals') {
                if (Array.isArray(currentVal)) show = currentVal.includes(targetVal);
                else show = String(currentVal) === String(targetVal);
              } else if (op === 'not_equals') {
                if (Array.isArray(currentVal)) show = !currentVal.includes(targetVal);
                else show = String(currentVal) !== String(targetVal);
              } else if (op === 'contains') {
                const currentStr = Array.isArray(currentVal) ? currentVal.join(',') : String(currentVal);
                show = currentStr.toLowerCase().includes(targetVal.toLowerCase());
              }
            } else {
              show = true;
            }
          }

          if (hasLogic) {
            const group = $(`.field-group[data-field-id="${field.id}"]`);
          const pageContainer = group.closest('.form-page');
          const pageIdx = pageContainer.length > 0 ? parseInt(pageContainer.attr('id').split('_')[1]) : 0;
          const isOnActivePage = (pageIdx === window.currentPageIdx);

            if (show) {
            group.removeClass('conditional-hidden');
            if (isOnActivePage) {
              if (group.css('display') === 'none') {
                group.slideDown(250);
              }
            } else {
              group.css('display', '');
            }
          } else {
            group.addClass('conditional-hidden');
            if (isOnActivePage) {
              if (group.css('display') !== 'none') {
                group.slideUp(250, function() {
                  clearFieldValue(field);
                });
              } else {
                clearFieldValue(field);
              }
            } else {
              group.css('display', 'none');
              clearFieldValue(field);
              }
            }
          }
        });
      }

      function getFieldValue(field) {
        const inputId = `input_${field.id}`;
        if (field.type === 'checkbox') {
          const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
          return Array.from(checked).map(c => c.value);
        } else if (field.type === 'radio') {
          const selected = document.querySelector(`input[name="${field.id}"]:checked`);
          return selected ? selected.value : '';
        } else {
          const el = document.getElementById(inputId);
          return el ? el.value : '';
        }
      }

      function clearFieldValue(field) {
        const inputId = `input_${field.id}`;
        if (field.type === 'checkbox' || field.type === 'radio') {
        $(`input[name="${field.id}"]`).prop('checked', false);
        } else if (field.type === 'rating') {
        $(`#${inputId}`).val('');
          $(`.star-rating[data-id="${field.id}"] .star`).removeClass('selected');
        } else if (field.type === 'grid_radio' || field.type === 'grid_checkbox') {
          $(`input[name^="response_${field.id}_"]`).prop('checked', false);
        } else {
        $(`#${inputId}`).val('');
        }
      }

      $(document).on('keydown', 'input[data-word-limit]', function(e) {
        // Once the word limit is reached: block whitespace (which would start
        // a new word), and let the user keep typing the word they're already
        // on, but only up to a sane length — otherwise holding a key down
        // lets a single "word" grow forever even though the count stays
        // at the cap.
        if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) {
          return;
        }
        const hasSelection = this.selectionStart !== this.selectionEnd;
        if (hasSelection) {
          return;
        }
        const maxWords = parseInt($(this).attr('data-word-limit'), 10);
        const words = this.value.split(/\s+/).filter(Boolean);
        const currentWords = words.length;
        if (currentWords < maxWords) {
          return;
        }

        const isWhitespace = /\s/.test(e.key);
        if (isWhitespace) {
          e.preventDefault();
          return;
        }

        const MAX_LAST_WORD_LENGTH = 25;
        const lastWord = words[words.length - 1] || '';
        if (lastWord.length >= MAX_LAST_WORD_LENGTH) {
          e.preventDefault();
        }
      });

      $(document).on('input', 'input[data-word-limit]', function() {
        const maxWords = parseInt($(this).attr('data-word-limit'), 10);
        const words = this.value.split(/\s+/).filter(Boolean);
        if (words.length > maxWords) {
          this.value = words.slice(0, maxWords).join(' ');
        }

        const fieldId = $(this).closest('.field-group').data('field-id');
        const countEl = document.getElementById(`wordCount_${fieldId}`);
        if (countEl) {
          const currentCount = this.value.split(/\s+/).filter(Boolean).length;
          countEl.textContent = `${currentCount}/${maxWords} words`;
          countEl.style.color = currentCount >= maxWords ? '#dc3545' : '#6c757d';
        }
      });

      $(document).on('change input blur', 'input, select, textarea', function() {
        // The save-progress/email-copy checkboxes and emails are meta-controls,
        // not form answers — they have their own dedicated handlers below and
        // must never themselves trigger an autosave of (possibly still-empty)
        // form fields.
        const elId = $(this).attr('id');
        if (elId === 'saveProgressEmail' || elId === 'saveProgressToggle' ||
            elId === 'emailCopyEmail' || elId === 'emailCopyToggle') return;

        // Find the parent field group
        const group = $(this).closest('.field-group');
        if (group.length > 0) {
          checkFieldValidation(group[0]);
        }
        
        // Also check if it's the auth section input
        if ($(this).attr('id') === 'input_cardno' || $(this).attr('id') === 'input_mobno') {
          checkAuthInputValidation(this);
        }

        evaluateLogic();
        scheduleDraftSave();
      });

      // Collects current answers from every visible field across all pages.
      // Shared by the final submit and the in-progress draft autosave.
      function collectResponses() {
        const responses = {};
        formData.fields.forEach(field => {
          if (field.type === 'section') return;

        const group = $(`.field-group[data-field-id="${field.id}"]`);
        if (group.hasClass('conditional-hidden')) return; // Do not submit hidden fields

          if (field.type === 'checkbox') {
            const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
            responses[field.id] = Array.from(checked).map(c => c.value);
          } else if (field.type === 'radio') {
            const selected = document.querySelector(`input[name="${field.id}"]:checked`);
            responses[field.id] = selected ? selected.value : '';
          } else if (field.type === 'grid_radio') {
            const rowAnswers = {};
            field.rows.forEach((r, ri) => {
              const checked = document.querySelector(`input[name="response_${field.id}_${ri}"]:checked`);
              rowAnswers[r] = checked ? checked.value : '';
            });
            responses[field.id] = rowAnswers;
          } else if (field.type === 'grid_checkbox') {
            const rowAnswers = {};
            field.rows.forEach((r, ri) => {
              const checked = document.querySelectorAll(`input[name="response_${field.id}_${ri}"]:checked`);
              rowAnswers[r] = Array.from(checked).map(c => c.value);
            });
            responses[field.id] = rowAnswers;
          } else if (field.type === 'grid_number') {
            const rowAnswers = {};
            (field.rows || []).forEach((r, ri) => {
              rowAnswers[r] = {};
              (field.columns || []).forEach((c, ci) => {
                const input = document.querySelector(`input[name="response_${field.id}_${ri}_${ci}"]`);
                rowAnswers[r][c] = input && input.value.trim() !== '' ? input.value.trim() : '0';
              });
            });
            responses[field.id] = rowAnswers;
          } else if (isGuestListField(field)) {
            const list = [];
            const container = document.getElementById(`guestListContainer_${field.id}`);
            if (container) {
              container.querySelectorAll('.guest-card').forEach(card => {
                const mobInput = card.querySelector('.guest-mobno-input');
                const mob = mobInput ? mobInput.value.trim() : '';
                const cardno = card.dataset.cardno || '';
                const name = card.dataset.name || '';
                const center = card.dataset.center || '';
                if (mob || cardno || name) {
                  list.push({ mobno: mob, cardno, name, center });
                }
              });
            }
            responses[field.id] = list;
          } else {
            const el = document.getElementById(`input_${field.id}`);
            responses[field.id] = el ? el.value.trim() : '';
          }
        });
        return responses;
      }

      async function submitForm(e) {
        e.preventDefault();

        const currentPageIdx = window.currentPageIdx || 0;
        const submitBtn = document.querySelector(`#formPage_${currentPageIdx} #submitBtn`) || document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Submitting...';
        }

        // Perform final page validation on the current active page
        const pageContainer = document.getElementById(`formPage_${currentPageIdx}`);
        let isValid = true;
        let firstInvalidMsg = '';

        if (currentPageIdx === 0 && !formData.isPublic) {
          const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
          if (authInput) {
            const authOk = await performAuthLookup(authInput);
            if (!authOk || window.isAuthVerified === false) {
              isValid = false;
              firstInvalidMsg = window.lastAuthErrorMessage || (document.getElementById('input_mobno') ? 'Please enter a valid registered mobile number' : 'Please enter a valid card number');
            } else if (formData.requireOtp && authInput.id === 'input_mobno' && !isOtpVerified) {
              isValid = false;
              firstInvalidMsg = 'Please verify your mobile number using OTP first';
            }
          }
        }

        const visibleGroups = $(pageContainer).find('.field-group:visible');
        visibleGroups.each(function() {
          const check = checkFieldValidation(this);
          if (!check.isValid) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = check.errorMsg;
          }
        });

        let saveProgressEmailToSend = null;
        const saveProgressToggle = document.getElementById('saveProgressToggle');
        if (saveProgressToggle && saveProgressToggle.checked) {
          const saveEmailValue = document.getElementById('saveProgressEmail').value.trim();
          if (!EMAIL_REGEX.test(saveEmailValue)) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = 'Please enter a valid email address to save your progress';
          } else {
            saveProgressEmailToSend = saveEmailValue;
          }
        }

        let copyEmailToSend = null;
        const emailCopyToggle = document.getElementById('emailCopyToggle');
        if (emailCopyToggle && emailCopyToggle.checked) {
          const copyEmailValue = document.getElementById('emailCopyEmail').value.trim();
          if (!EMAIL_REGEX.test(copyEmailValue)) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = 'Please enter a valid email address to receive a copy of your response';
          } else {
            copyEmailToSend = copyEmailValue;
          }
        }

        if (!isValid) {
          showFormAlertOnPage(currentPageIdx, firstInvalidMsg || 'Please correct the errors in the form', 'danger');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
          return;
        }

        // Clear general alert if valid
        const alert = document.getElementById(`formAlert_${currentPageIdx}`);
        if (alert) alert.style.display = 'none';

        // Collect responses across ALL pages
        const responses = collectResponses();

        const body = { responses };
        // Always tell the backend which email (if any) a draft exists under
        // for this session, even if the checkbox got unchecked right before
        // submitting — otherwise an orphaned draft is never cleaned up and
        // resurfaces on a later visit.
        const cleanupEmail = saveProgressEmailToSend || sessionDraftEmail;
        if (cleanupEmail) {
          body.email = cleanupEmail;
        }

        if (urlParams.get('preview') === 'true') {
          showFormAlertOnPage(currentPageIdx, 'Validation Passed! This is a preview, so no response was recorded.', 'success');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
          return;
        }

        if (!formData.isPublic) {
          if (formData.authType === 'mobno') {
            const mobno = document.getElementById('input_mobno')?.value?.trim();
            if (!mobno) {
              showFormAlertOnPage(currentPageIdx, 'Mobile Number is required', 'danger');
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Response';
              }
              return;
            }
            body.mobno = mobno;
          } else {
            const cardno = document.getElementById('input_cardno')?.value?.trim();
            if (!cardno) {
              showFormAlertOnPage(currentPageIdx, 'Card Number is required', 'danger');
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Response';
              }
              return;
            }
            body.cardno = cardno;
          }
        }

        try {
          const responseId = urlParams.get('responseId');
          const isEdit = responseId && formData.allowEdit;

          const url = isEdit
            ? `${CONFIG.baseUrl}/admin/forms/public/${formId}/responses/${responseId}`
            : `${CONFIG.baseUrl}/admin/forms/public/${formId}/submit`;

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          const data = await res.json();

          if (data.success) {
            if (!isEdit && formData.limitOneResponse) {
              localStorage.setItem(`form_submitted_${formId}`, 'true');
            }
            // A completed submission means this fill session is over — wipe
            // all local state so the next visit (or "submit another
            // response") starts from a genuinely blank form, not whatever
            // was last typed here. Also cancel any pending autosave: if one
            // was already scheduled from typing right before hitting submit,
            // letting it fire afterward would silently recreate a draft.
            clearTimeout(draftSaveTimeout);
            localStorage.removeItem(`form_has_draft_${formId}`);
            sessionDraftEmail = null;
            lastRestoredDraftEmail = null;
            const newRespId = data.data?.id || responseId;
            if (copyEmailToSend && newRespId) {
              fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}/responses/${newRespId}/email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: copyEmailToSend })
              }).catch(() => {});
            }
            showSuccessScreen(newRespId, copyEmailToSend);
          } else {
            showFormAlertOnPage(currentPageIdx, data.message || 'Failed to submit response', 'danger');
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit Response';
            }
          }
        } catch (err) {
          showFormAlertOnPage(currentPageIdx, 'Network error. Please try again.', 'danger');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
        }
      }

      function showSuccessScreen(respId, emailedTo) {
        const container = document.getElementById('formContainer');
        const isEdit = urlParams.get('responseId') ? true : false;
        
        let actionsHtml = '';
        
        // Edit Response button
        if (formData.allowEdit && respId) {
          actionsHtml += `
            <a href="view.html?id=${formId}&responseId=${respId}" class="submit-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; width:240px; text-align:center; margin:0.5rem; box-sizing:border-box;">
              <i class="fas fa-edit"></i> Edit Response
            </a>
          `;
        }

        // Submit Another Response link
        const alreadySubmittedLimit = formData.limitOneResponse && !formData.allowEdit;
        if (formData.showSubmitAnother && !alreadySubmittedLimit) {
          actionsHtml += `
            <a href="view.html?id=${formId}" class="submit-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; width:240px; text-align:center; background-color:#6c757d; margin:0.5rem; box-sizing:border-box;">
              <i class="fas fa-redo"></i> Submit another response
            </a>
          `;
        }

        const msgText = formData.confirmationMessage || 'Thank you for filling out the form. Your response has been recorded.';

        const emailedNoticeHtml = emailedTo
          ? `<p style="margin-top:1rem; font-size:0.9rem; color:#28a745;"><i class="fas fa-envelope"></i> A copy of your response has been emailed to ${emailedTo}.</p>`
          : '';

        container.innerHTML = `
          <div class="success-screen">
            <div class="success-icon" style="color:#28a745;">✓</div>
            <h2>${isEdit ? 'Response Updated!' : 'Response Submitted!'}</h2>
            <p>${renderRichText(msgText)}</p>
            ${emailedNoticeHtml}
            <div style="margin-top:2rem; display:flex; justify-content:center; flex-wrap:wrap; gap:0.5rem;">
              ${actionsHtml}
            </div>
          </div>
        `;
      }

      function showAlreadySubmittedState() {
        const container = document.getElementById('formContainer');
        container.innerHTML = `
          <div class="success-screen">
            <div class="success-icon" style="color:#ffc107;">⚠️</div>
            <h2>Already Submitted</h2>
            <p>You have already submitted a response to this form. Each user is limited to one response.</p>
          </div>
        `;
      }

      async function loadAndPopulateResponse(responseId) {
        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}/responses/${responseId}`);
          const data = await res.json();

          if (!data.success) {
            showFormAlertOnPage(0, 'Failed to load your previous response for editing.', 'danger');
            return;
          }

          populateFormFields(data.data);
        } catch (err) {
          showFormAlertOnPage(0, 'Failed to load your previous response due to a network error.', 'danger');
        }
      }

      function populateFormFields(responseObj) {
        const answers = responseObj.responses || {};
        if (responseObj.respondent?.mobno && document.getElementById('input_mobno')) {
          const mob = responseObj.respondent.mobno;
          document.getElementById('input_mobno').value = mob;
          document.getElementById('input_mobno').readOnly = true;
          document.getElementById('input_mobno').style.backgroundColor = '#e9ecef';
          $('#input_mobno').after(`
            <div id="info_mobno" style="color: #28a745; font-size: 0.88rem; margin-top: 0.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
              <i class="fas fa-check-circle"></i> Registered to: ${responseObj.respondent.issuedto || 'Registered User'} (${responseObj.respondent.center || 'No Center'})
            </div>
          `);
        } else if (responseObj.cardno && document.getElementById('input_cardno')) {
          const card = responseObj.cardno;
          document.getElementById('input_cardno').value = card;
          document.getElementById('input_cardno').readOnly = true;
          document.getElementById('input_cardno').style.backgroundColor = '#e9ecef';
          $('#input_cardno').after(`
            <div id="info_cardno" style="color: #28a745; font-size: 0.88rem; margin-top: 0.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
              <i class="fas fa-check-circle"></i> Registered to: ${responseObj.respondent?.issuedto || 'Registered User'} (${responseObj.respondent?.center || 'No Center'})
            </div>
          `);
        }

        populateAnswers(answers);
      }



      function showErrorState(message) {
        const container = document.getElementById('formContainer');
        container.innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>An Error Occurred</h2>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }

      function escapeAttr(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      let otpCountdownTimer = null;

      async function handleSendOtp() {
        const mobInput = document.getElementById('input_mobno');
        const mobVal = mobInput ? mobInput.value.trim().replace(/\D/g, '') : '';
        const infoEl = document.getElementById('info_mobno');
        const btn = document.getElementById('sendOtpBtn');

        if (mobVal.length !== 10) {
          infoEl.innerHTML = '<span style="color:#dc3545;"><i class="fas fa-exclamation-circle"></i> Please enter a valid 10-digit mobile number</span>';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        infoEl.innerHTML = '<span style="color:#6c757d;"><i class="fas fa-spinner fa-spin"></i> Checking authorization...</span>';

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobno: mobVal, formId: formData.id })
          });
          const data = await res.json();

          if (data.success) {
            infoEl.innerHTML = '<span style="color:#28a745; font-weight:600;"><i class="fas fa-check-circle"></i> OTP sent to your WhatsApp/SMS!</span>';
            $('#otpInputSection').slideDown();
            $('#input_otp').focus();
            startOtpTimer(60);
          } else {
            infoEl.innerHTML = `<span style="color:#dc3545; font-weight:600;"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(data.message || 'Failed to send OTP')}</span>`;
          }
        } catch (err) {
          infoEl.innerHTML = '<span style="color:#dc3545;"><i class="fas fa-exclamation-circle"></i> Network error. Please try again.</span>';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send OTP';
        }
      }

      function startOtpTimer(seconds) {
        clearInterval(otpCountdownTimer);
        $('#resendOtpBtn').hide();
        let remaining = seconds;
        const timerText = document.getElementById('otpTimerText');
        timerText.textContent = `Resend OTP in ${remaining}s`;

        otpCountdownTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(otpCountdownTimer);
            timerText.textContent = '';
            $('#resendOtpBtn').show();
          } else {
            timerText.textContent = `Resend OTP in ${remaining}s`;
          }
        }, 1000);
      }

      async function handleVerifyOtp() {
        const mobInput = document.getElementById('input_mobno');
        const mobVal = mobInput ? mobInput.value.trim().replace(/\D/g, '') : '';
        const otpInput = document.getElementById('input_otp');
        const otpVal = otpInput ? otpInput.value.trim() : '';
        const errEl = document.getElementById('otpErrorMsg');
        const btn = document.getElementById('verifyOtpBtn');

        if (otpVal.length !== 6) {
          errEl.textContent = 'Please enter the complete 6-digit OTP';
          errEl.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Verifying...';
        errEl.style.display = 'none';

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/otp/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobno: mobVal, otp: otpVal })
          });
          const data = await res.json();

          if (data.success) {
            isOtpVerified = true;
            clearInterval(otpCountdownTimer);

            // Fetch member info & allowlist department
            const identRes = await fetch(`${CONFIG.baseUrl}/admin/forms/public/resolve-identity?type=mobno&value=${mobVal}&formId=${formData.id}`);
            const identData = await identRes.json();

            const memberName = identData.data?.name || 'Registered Member';
            const nameEl = document.getElementById('verifiedUserName');
            const mobEl = document.getElementById('verifiedUserMob');
            if (nameEl) nameEl.textContent = memberName;
            if (mobEl) mobEl.textContent = mobVal;

            $('#otpGateContainer').hide();
            $('#verifiedUserBanner').css('display', 'flex');
            $('#formContentWrapper').show();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Pre-fill and lock Department if linked in allowlist
            if (identData.data?.department) {
              const deptField = (formData.fields || []).find(f => f.vendorRole === 'department' || f.label.toLowerCase().includes('department'));
              if (deptField) {
                const deptEl = document.getElementById(`input_${deptField.id}`);
                if (deptEl) {
                  deptEl.value = identData.data.department;
                  deptEl.disabled = true;
                  deptEl.style.backgroundColor = '#e9ecef';
                  deptEl.dispatchEvent(new Event('change'));
                }
              }
            }

            // Restore draft if available
            if (identData.data?.email) {
              const saveEmailInput = document.getElementById('saveProgressEmail');
              if (saveEmailInput) saveEmailInput.value = identData.data.email;
              attemptRestoreDraft(identData.data.email);
            }
          } else {
            errEl.textContent = data.message || 'Invalid or expired OTP';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = 'Network error during verification. Please try again.';
          errEl.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Verify & Open';
        }
      }

      function signOutOtp() {
        isOtpVerified = false;
        clearInterval(otpCountdownTimer);
        document.getElementById('input_otp').value = '';
        $('#otpInputSection').hide();
        $('#info_mobno').html('');
        $('#verifiedUserBanner').hide();
        $('#formContentWrapper').slideUp();
        $('#otpGateContainer').slideDown();
      }

      $(document).on('click', '#sendOtpBtn, #resendOtpBtn', handleSendOtp);
      $(document).on('click', '#verifyOtpBtn', handleVerifyOtp);
      $(document).on('input', '#input_otp', function() {
        if (this.value.trim().length === 6) {
          handleVerifyOtp();
        }
      });
      $(document).on('keypress', '#input_otp', function(e) {
        if (e.which === 13) {
          e.preventDefault();
          handleVerifyOtp();
        }
      });
      $(document).on('keypress', '#input_mobno', function(e) {
        if (e.which === 13) {
          e.preventDefault();
          handleSendOtp();
        }
      });

      // Start fetching on load
      loadForm();
    </script>
  </body>

</html>
