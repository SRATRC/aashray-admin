<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Form - Aashray</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/config.js"></script>

    <!-- Include FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="../../style/css/styles.css" />
    <style>
      :root {
        --theme-color: #204060;
      }
      body {
        background-color: #f0f2f5;
        padding: 2rem 1rem;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      .form-container {
        max-width: 680px;
        margin: 0 auto;
      }
      .form-header {
        background: #fff;
        border-top: 10px solid var(--theme-color);
        border-radius: 8px;
        padding: 2.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      }
      .form-header h1 {
        margin: 0 0 0.75rem 0;
        color: var(--theme-color);
        font-size: 2rem;
        font-weight: 800;
        word-wrap: break-word;
      }
      .form-header p {
        margin: 0;
        color: #495057;
        font-size: 0.95rem;
        line-height: 1.5;
        word-wrap: break-word;
      }
      .form-body {
        background: #fff;
        border-radius: 8px;
        padding: 2.25rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        margin-bottom: 1.25rem;
      }
      .field-group {
        margin-bottom: 2rem;
      }
      .field-group label {
        display: block;
        font-weight: 700;
        color: var(--theme-color);
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }
      .field-group .required {
        color: #dc3545;
        margin-left: 0.2rem;
      }
      
      /* Input styles */
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      select,
      textarea {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 0.95rem;
        background-color: #fafafa;
        transition: border-color 0.2s, background-color 0.2s;
        box-sizing: border-box;
      }
      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="date"]:focus,
      input[type="time"]:focus,
      select:focus,
      textarea:focus {
        border-color: #4c86b0;
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(76, 134, 176, 0.1);
      }
      textarea {
        resize: vertical;
      }

      /* Options layout */
      .option-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.6rem;
      }
      .option-item input[type="radio"],
      .option-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--theme-color);
      }
      .option-item label {
        margin: 0;
        font-weight: 400;
        color: #495057;
        cursor: pointer;
        font-size: 0.95rem;
      }

      /* Star rating design */
      .star-rating {
        display: inline-flex;
        gap: 0.4rem;
        font-size: 2.2rem;
        cursor: pointer;
      }
      .star-rating .star {
        color: #dee2e6;
        transition: color 0.15s, transform 0.1s;
      }
      .star-rating .star:hover {
        transform: scale(1.15);
      }
      .star-rating .star.selected,
      .star-rating .star.hovered {
        color: #ffc107;
      }

      /* Matrix Grid design */
      .grid-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }
      .grid-table th {
        background: #f8f9fa;
        color: var(--theme-color);
        font-weight: 700;
        padding: 0.75rem;
        text-align: center;
        border: 1px solid #dee2e6;
      }
      .grid-table td {
        padding: 0.75rem;
        text-align: center;
        border: 1px solid #dee2e6;
      }
      .grid-table td:first-child {
        text-align: left;
        font-weight: 600;
        color: #495057;
        background: #fbfbfb;
      }
      .grid-table input[type="radio"],
      .grid-table input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--theme-color);
      }

      /* Success Screen */
      .success-screen {
        background: #fff;
        border-radius: 8px;
        padding: 3rem 2.25rem;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      }
      .success-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }
      .success-screen h2 {
        color: var(--theme-color);
        margin-top: 0;
        margin-bottom: 0.75rem;
        font-weight: 800;
      }
      .success-screen p {
        color: #6c757d;
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
      }

      /* Alert blocks */
      [id^="formAlert_"] {
        padding: 0.75rem 1.25rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        display: none;
        font-weight: 500;
      }
      .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

      .submit-btn {
        background-color: var(--theme-color);
        color: white;
        border: none;
        padding: 0.75rem 1.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        box-shadow: 0 4px 6px rgba(32, 64, 96, 0.15);
      }
      .submit-btn:hover {
        opacity: 0.9;
      }
      .submit-btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }
      .auth-section {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 1.25rem;
        border-radius: 8px;
        margin-bottom: 2rem;
      }
      .loading-state, .error-state {
        text-align: center;
        padding: 4rem 2rem;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: var(--theme-color);
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error-state i {
        font-size: 3rem;
        color: #dc3545;
        margin-bottom: 1rem;
      }
      .error-state h2 {
        margin-bottom: 0.5rem;
      }

      @media (max-width: 600px) {
        body { padding: 1rem 0.5rem; }
        .form-header { padding: 1.5rem; }
        .form-body { padding: 1.5rem; }
        .form-header h1 { font-size: 1.5rem; }
      }
    </style>
  </head>

  <body>
    <div id="previewBanner" style="display:none; position:fixed; top:0; left:0; right:0; background:#ffc107; color:#212529; text-align:center; padding:0.6rem; font-weight:700; font-size:0.95rem; z-index:9999; box-shadow:0 2px 5px rgba(0,0,0,0.15);">
      <i class="fas fa-eye"></i> Form Preview Mode — Responses will not be submitted
    </div>

    <div class="form-container" id="formContainer">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Loading form...</p>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const formId = urlParams.get('id');

      let formData = null;

      async function loadForm() {
        if (urlParams.get('preview') === 'true') {
          try {
            const rawData = sessionStorage.getItem('preview_form_data');
            if (!rawData) {
              showErrorState('No preview data found. Please open preview from the Form Builder.');
              return;
            }
            formData = JSON.parse(rawData);
            document.title = `[Preview] ${formData.title} - Aashray`;
            renderForm(formData);
          } catch (err) {
            showErrorState('Failed to load preview form data.');
          }
          return;
        }

        if (!formId) {
          showErrorState('No form ID specified in the URL.');
          return;
        }

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}`);
          const data = await res.json();

          if (!data.success) {
            showErrorState(data.message || 'Form not found or inactive.');
            return;
          }

          formData = data.data;

          // Limit to 1 response client-side check (only if not editing)
          if (formData.limitOneResponse && !formData.allowEdit && !urlParams.get('responseId') && localStorage.getItem(`form_submitted_${formId}`) === 'true') {
            showAlreadySubmittedState();
            return;
          }
          
          if (formData.isClosed && urlParams.get('preview') !== 'true') {
            renderClosedScreen(formData);
            return;
          }

          document.title = `${formData.title} - Aashray`;
          renderForm(formData);

          // If editing response, load previous responses
          const responseId = urlParams.get('responseId');
          if (responseId && formData.allowEdit) {
            await loadAndPopulateResponse(responseId);
          }
        } catch (err) {
          showErrorState('Unable to load form. Please try again later.');
        }
      }

      // Secure DOM-based HTML Sanitizer for B, I, U, A elements
      function renderRichText(text) {
        if (!text) return '';
        const parser = new DOMParser();
        const doc = parser.parseFromString(`<div>${text}</div>`, 'text/html');
        const allowedTags = ['B', 'I', 'U', 'A', 'BR', 'STRONG', 'EM', 'SPAN', 'P'];
        
        function sanitizeNode(node) {
          const children = Array.from(node.childNodes);
          children.forEach(child => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              if (!allowedTags.includes(child.nodeName)) {
                const textNode = doc.createTextNode(child.textContent);
                node.replaceChild(textNode, child);
              } else {
                if (child.nodeName === 'A') {
                  const href = child.getAttribute('href');
                  child.removeAttribute('onclick');
                  child.removeAttribute('onerror');
                  child.setAttribute('target', '_blank');
                  child.setAttribute('rel', 'noopener noreferrer');
                }
                sanitizeNode(child);
              }
            }
          });
        }
        
        sanitizeNode(doc.body.firstChild);
        return doc.body.firstChild.innerHTML;
      }

      function renderClosedScreen(form) {
        const container = document.getElementById('formContainer');
        const msg = form.closeMessage || 'This form is no longer accepting responses.';
        
        container.innerHTML = `
          <div class="success-screen" style="border-top: 10px solid #dc3545; max-width:600px; margin:2rem auto; background:#fff; border-radius:8px; padding:3rem 2rem; box-shadow:0 4px 6px rgba(0,0,0,0.03); text-align:center;">
            <div class="success-icon" style="color: #dc3545; font-size:4rem; margin-bottom:1.5rem;"><i class="fas fa-exclamation-circle"></i></div>
            <h2 style="color:#204060; margin:0 0 1rem 0; font-weight:800;">Form Closed</h2>
            <p style="margin: 0; color: #495057; font-size: 1.1rem; line-height: 1.6;">${renderRichText(msg)}</p>
            <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
              <span style="font-size: 0.85rem; color: #6c757d;">This form has expired or reached its submission limit.</span>
            </div>
          </div>
        `;
      }

      function renderForm(form) {
        const container = document.getElementById('formContainer');

        const themeColor = form.themeColor || '#204060';
        document.documentElement.style.setProperty('--theme-color', themeColor);

        if (urlParams.get('preview') === 'true') {
          document.getElementById('previewBanner').style.display = 'block';
          container.style.marginTop = '4rem';
        }

        // Separate fields into page sections
        const pages = [];
        let currentPage = {
          id: 'page_0',
          title: form.title,
          description: form.description,
          fields: [],
          nextAction: form.section1Action || 'next'
        };

        const isAuth = !form.isPublic;

        form.fields.forEach(field => {
          if (field.type === 'section') {
            pages.push(currentPage);
            currentPage = {
              id: field.id,
              title: field.label,
              description: field.description || '',
              fields: [],
              nextAction: field.nextAction || 'next'
            };
          } else {
            currentPage.fields.push(field);
          }
        });
        pages.push(currentPage);

        window.pageIndices = {};
        pages.forEach((p, idx) => {
          window.pageIndices[p.id] = idx;
        });

        // Render progress bar container
        let progressHtml = '';
        if (form.showProgressBar) {
          progressHtml = `
            <div id="progressContainer" style="margin-top: 1.5rem; padding: 1rem 1.5rem; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
              <div style="display:flex; justify-content:space-between; font-size:0.95rem; color:#000000; font-weight:700; margin-bottom:0.4rem;">
                <span>Progress</span>
                <span id="progressText">Page 1 of ${pages.length}</span>
              </div>
              <div style="width:100%; height:8px; background:#e9ecef; border-radius:50px; overflow:hidden;">
                <div id="progressBar" style="width:${(1 / pages.length) * 100}%; height:100%; background:linear-gradient(135deg, var(--theme-color) 0%, #4c86b0 100%); transition:width 0.3s ease;"></div>
              </div>
            </div>
          `;
        }

        let pagesHtml = '';
        pages.forEach((page, pi) => {
          let fieldsHtml = '';
          
          if (pi === 0 && isAuth) {
            const isMobAuth = form.authType === 'mobno';
            if (isMobAuth && form.requireOtp) {
              fieldsHtml += `
                <div class="auth-section" style="margin-bottom: 1.5rem; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 1.25rem;">
                  <label for="input_mobno" style="font-weight: 700; color: var(--theme-color);">Mobile Number *</label>
                  <div style="display:flex; gap:0.5rem; align-items:stretch;">
                    <input type="tel" id="input_mobno" placeholder="Enter your registered mobile number" required style="flex: 1; padding: 0.65rem 0.85rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; background-color: #fafafa;" />
                    <button type="button" id="sendOtpBtn" class="submit-btn" style="width: auto; padding: 0 1rem; font-size: 0.85rem; display:none; background-color: var(--theme-color);">Send OTP</button>
                  </div>
                  <div id="otpInputSection" style="display:none; margin-top: 1rem; border-top: 1px dashed #ced4da; padding-top: 1rem;">
                    <label for="input_otp" style="font-weight: 700; color: var(--theme-color);">Verification OTP *</label>
                    <div style="display:flex; gap:0.5rem; align-items:stretch;">
                      <input type="text" id="input_otp" placeholder="Enter 6-digit OTP" maxLength="6" style="flex: 1; padding: 0.65rem 0.85rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; background-color: #fafafa;" />
                      <button type="button" id="verifyOtpBtn" class="submit-btn" style="width: auto; padding: 0 1rem; font-size: 0.85rem; background-color: #28a745;">Verify</button>
                    </div>
                  </div>
                </div>
              `;
            } else {
              fieldsHtml += `
                <div class="auth-section" style="margin-bottom: 1.5rem; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 1.25rem;">
                  <label for="${isMobAuth ? 'input_mobno' : 'input_cardno'}" style="font-weight: 700; color: var(--theme-color);">${isMobAuth ? 'Mobile Number *' : 'Card Number *'}</label>
                  <input type="${isMobAuth ? 'tel' : 'text'}" id="${isMobAuth ? 'input_mobno' : 'input_cardno'}" placeholder="${isMobAuth ? 'Enter your registered mobile number' : 'Enter your card number'}" required style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; background-color: #fafafa;" />
                </div>
              `;
            }
          }

          page.fields.forEach(f => {
            fieldsHtml += renderField(f);
          });

          const displayStyle = pi === 0 ? 'block' : 'none';

          // Navigation buttons block based on early submission
          let navButtonsHtml = '';
          if (pi > 0) {
            navButtonsHtml += `<button type="button" class="submit-btn btn-back" onclick="goToPage(${pi - 1})" style="background-color:#6c757d; margin-right:0.5rem; width:auto; padding:0.6rem 1.5rem;"><i class="fas fa-arrow-left"></i> Back</button>`;
          }

          const action = page.nextAction;
          if (action === 'submit' || pi === pages.length - 1) {
            navButtonsHtml += `<button type="submit" class="submit-btn" id="submitBtn" style="width:auto; padding:0.6rem 1.5rem;">Submit Response</button>`;
          } else {
            let targetPageIdx = pi + 1;
            if (action !== 'next' && window.pageIndices[action] !== undefined) {
              targetPageIdx = window.pageIndices[action];
            }
            navButtonsHtml += `<button type="button" class="submit-btn btn-next" onclick="validateAndGoToPage(${pi}, ${targetPageIdx})" style="width:auto; padding:0.6rem 1.5rem;">Next <i class="fas fa-arrow-right"></i></button>`;
          }

          pagesHtml += `
            <div class="form-page" id="formPage_${pi}" style="display: ${displayStyle}">
              <div class="form-header">
                <h1>${renderRichText(page.title)}</h1>
                ${page.description ? `<p>${renderRichText(page.description)}</p>` : ''}
              </div>
              <div class="form-body">
                <div id="formAlert_${pi}"></div>
                <form class="page-form" onsubmit="submitForm(event)">
                  ${fieldsHtml}
                  <div style="margin-top:2rem; display:flex; justify-content:space-between; align-items:center;">
                    <div>${navButtonsHtml}</div>
                  </div>
                </form>
              </div>
            </div>
          `;
        });

        container.innerHTML = `
          <div id="pagesContainer">${pagesHtml}</div>
          ${progressHtml}
        `;

        window.totalPagesCount = pages.length;
        window.currentPageIdx = 0;

        initStarRatings();
        evaluateLogic();
      }

      function goToPage(pageIdx) {
        $(`.form-page`).hide();
        $(`#formPage_${pageIdx}`).show();
        window.currentPageIdx = pageIdx;
        
        if (document.getElementById('progressBar')) {
          const pct = ((pageIdx + 1) / window.totalPagesCount) * 100;
          document.getElementById('progressBar').style.width = `${pct}%`;
          document.getElementById('progressText').textContent = `Page ${pageIdx + 1} of ${window.totalPagesCount}`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function validateFieldInput(field, value, checkedCount) {
        if (!field.validation) {
          return { isValid: true };
        }

        const val = field.validation;
        const rule = val.rule || val.type;
        if (!rule) {
          return { isValid: true };
        }

        const errorMsg = val.errorMsg || 'Invalid value';
        const isEmpty = (value === '' || value === null || value === undefined);

        if (!field.required && isEmpty && !['checkbox_limit', 'select_at_least', 'select_at_most', 'select_exactly'].includes(rule)) {
          return { isValid: true };
        }

        // --- 1. NUMBER RULES ---
        if (['greater_than', 'greater_than_or_equal', 'less_than', 'less_than_or_equal', 'equal', 'not_equal', 'between', 'not_between', 'is_number', 'whole_number', 'number_check', 'range', 'ten_digit'].includes(rule)) {
          const num = parseFloat(value);
          if (isNaN(num) || value.trim() === '') {
            return { isValid: false, errorMsg: errorMsg || 'Must be a valid number' };
          }

          const targetVal = val.value ? parseFloat(val.value) : undefined;

          switch (rule) {
            case 'greater_than':
              if (targetVal !== undefined && !(num > targetVal)) return { isValid: false, errorMsg };
              break;
            case 'greater_than_or_equal':
              if (targetVal !== undefined && !(num >= targetVal)) return { isValid: false, errorMsg };
              break;
            case 'less_than':
              if (targetVal !== undefined && !(num < targetVal)) return { isValid: false, errorMsg };
              break;
            case 'less_than_or_equal':
              if (targetVal !== undefined && !(num <= targetVal)) return { isValid: false, errorMsg };
              break;
            case 'equal':
              if (targetVal !== undefined && num !== targetVal) return { isValid: false, errorMsg };
              break;
            case 'not_equal':
              if (targetVal !== undefined && num === targetVal) return { isValid: false, errorMsg };
              break;
            case 'between':
              const minBetween = val.min ? parseFloat(val.min) : undefined;
              const maxBetween = val.max ? parseFloat(val.max) : undefined;
              if (minBetween !== undefined && maxBetween !== undefined) {
                if (num < minBetween || num > maxBetween) return { isValid: false, errorMsg };
              }
              break;
            case 'not_between':
              const minNotBetween = val.min ? parseFloat(val.min) : undefined;
              const maxNotBetween = val.max ? parseFloat(val.max) : undefined;
              if (minNotBetween !== undefined && maxNotBetween !== undefined) {
                if (num >= minNotBetween && num <= maxNotBetween) return { isValid: false, errorMsg };
              }
              break;
            case 'is_number':
            case 'number_check':
              break;
            case 'whole_number':
              if (!Number.isInteger(num)) return { isValid: false, errorMsg };
              break;
            case 'ten_digit':
              const cleanNum = value.trim().replace(/\D/g, '');
              if (cleanNum.length !== 10) return { isValid: false, errorMsg: errorMsg || 'Must be a 10-digit number' };
              break;
            case 'range':
              if (val.min && num < parseFloat(val.min)) return { isValid: false, errorMsg };
              if (val.max && num > parseFloat(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 2. TEXT RULES ---
        else if (['contains', 'does_not_contain', 'email', 'url'].includes(rule) && val.category === 'text') {
          const strVal = String(value);
          switch (rule) {
            case 'contains':
              if (val.value && !strVal.includes(val.value)) return { isValid: false, errorMsg };
              break;
            case 'does_not_contain':
              if (val.value && strVal.includes(val.value)) return { isValid: false, errorMsg };
              break;
            case 'email':
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
              if (!emailRegex.test(strVal)) return { isValid: false, errorMsg };
              break;
            case 'url':
              const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
              if (!urlRegex.test(strVal)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 3. LENGTH RULES ---
        else if (['max_char_count', 'min_char_count', 'length'].includes(rule)) {
          const len = value.length;
          switch (rule) {
            case 'max_char_count':
              if (val.value && len > parseInt(val.value)) return { isValid: false, errorMsg };
              break;
            case 'min_char_count':
              if (val.value && len < parseInt(val.value)) return { isValid: false, errorMsg };
              break;
            case 'length':
              if (val.min && len < parseInt(val.min)) return { isValid: false, errorMsg };
              if (val.max && len > parseInt(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 4. REGULAR EXPRESSION RULES ---
        else if (['contains', 'does_not_contain', 'matches', 'does_not_match', 'regex'].includes(rule)) {
          const strVal = String(value);
          const pattern = val.value || val.pattern;
          if (pattern) {
            try {
              let finalPattern = pattern;
              if (rule === 'matches' || rule === 'does_not_match') {
                if (!finalPattern.startsWith('^')) finalPattern = '^' + finalPattern;
                if (!finalPattern.endsWith('$')) finalPattern = finalPattern + '$';
              }
              const rx = new RegExp(finalPattern);
              const isMatch = rx.test(strVal);

              if ((rule === 'contains' || rule === 'matches' || rule === 'regex') && !isMatch) {
                return { isValid: false, errorMsg };
              }
              if ((rule === 'does_not_contain' || rule === 'does_not_match') && isMatch) {
                return { isValid: false, errorMsg };
              }
            } catch (e) {
              console.error("Invalid regex pattern validation:", e);
            }
          }
        }

        // --- 5. CHECKBOX CHOICE LIMIT RULES ---
        else if (['select_at_least', 'select_at_most', 'select_exactly', 'checkbox_limit'].includes(rule)) {
          const count = parseInt(checkedCount || 0);
          if (!field.required && count === 0) return { isValid: true };

          const targetNum = val.value ? parseInt(val.value) : undefined;

          switch (rule) {
            case 'select_at_least':
              if (targetNum !== undefined && count < targetNum) return { isValid: false, errorMsg };
              break;
            case 'select_at_most':
              if (targetNum !== undefined && count > targetNum) return { isValid: false, errorMsg };
              break;
            case 'select_exactly':
              if (targetNum !== undefined && count !== targetNum) return { isValid: false, errorMsg };
              break;
            case 'checkbox_limit':
              if (val.min && count < parseInt(val.min)) return { isValid: false, errorMsg };
              if (val.max && count > parseInt(val.max)) return { isValid: false, errorMsg };
              break;
          }
        }

        // --- 6. DATE RANGE RULES ---
        else if (rule === 'date_range') {
          const dateVal = new Date(value);
          if (isNaN(dateVal.getTime())) return { isValid: false, errorMsg: 'Must be a valid date' };
          if (val.min && dateVal < new Date(val.min)) return { isValid: false, errorMsg };
          if (val.max && dateVal > new Date(val.max)) return { isValid: false, errorMsg };
        }

        return { isValid: true };
      }

      function showInlineError(fid, msg) {
        const errorEl = document.getElementById(`error_${fid}`);
        if (errorEl) {
          $(errorEl).find('span').text(msg);
          $(errorEl).show();
        }
      }

      function clearInlineError(fid) {
        const errorEl = document.getElementById(`error_${fid}`);
        if (errorEl) {
          $(errorEl).hide();
        }
      }

      function checkFieldValidation(group) {
        const fid = $(group).data('field-id');
        const field = formData.fields.find(f => f.id === fid);
        if (!field) return { isValid: true };

        const inputs = $(group).find('input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="tel"], select, textarea');

        let answerVal = null;
        let checkedCount = 0;
        if (field.type === 'checkbox') {
          const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
          answerVal = Array.from(checked).map(c => c.value);
          checkedCount = checked.length;
        } else if (field.type === 'radio') {
          const selected = document.querySelector(`input[name="${field.id}"]:checked`);
          answerVal = selected ? selected.value : '';
        } else if (field.type === 'grid_radio') {
          const selectedCols = [];
          let hasSelectionError = false;
          let errMsg = '';
          field.rows.forEach((r, ri) => {
            const checked = document.querySelector(`input[name="response_${field.id}_${ri}"]:checked`);
            if (field.required && !checked) {
              hasSelectionError = true;
              errMsg = `Please select an option for each row`;
            }
            if (checked) {
              selectedCols.push(checked.value);
            }
          });

          if (!hasSelectionError && field.limitOnePerColumn) {
            const uniqueCols = new Set(selectedCols);
            if (uniqueCols.size < selectedCols.length) {
              hasSelectionError = true;
              errMsg = `Please select a unique option per column (limit to one per column)`;
            }
          }
          if (hasSelectionError) {
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          } else {
            clearInlineError(field.id);
            return { isValid: true };
          }
        } else if (field.type === 'grid_checkbox') {
          let hasSelectionError = false;
          let errMsg = '';
          field.rows.forEach((r, ri) => {
            const checked = document.querySelectorAll(`input[name="response_${field.id}_${ri}"]:checked`);
            if (field.required && checked.length === 0) {
              hasSelectionError = true;
              errMsg = `Please select at least one checkbox for each row`;
            }
          });
          if (hasSelectionError) {
            showInlineError(field.id, errMsg);
            return { isValid: false, errorMsg: errMsg };
          } else {
            clearInlineError(field.id);
            return { isValid: true };
          }
        } else {
          const el = document.getElementById(`input_${field.id}`);
          answerVal = el ? el.value.trim() : '';
        }

        // 1. Required Check
        if (field.required) {
          if (answerVal === '' || answerVal === null || answerVal === undefined || (Array.isArray(answerVal) && answerVal.length === 0)) {
            const msg = `This field is required`;
            showInlineError(field.id, msg);
            inputs.css('border-color', '#dc3545');
            return { isValid: false, errorMsg: msg };
          }
        } else {
          // If not required and empty, skip rule validation
          const isEmpty = (answerVal === '' || answerVal === null || answerVal === undefined || (Array.isArray(answerVal) && answerVal.length === 0));
          if (isEmpty) {
            clearInlineError(field.id);
            inputs.css('border-color', '#ced4da');
            return { isValid: true };
          }
        }

        // 2. Custom Rule Check
        if (field.validation) {
          const valCheck = validateFieldInput(field, answerVal, checkedCount);
          if (!valCheck.isValid) {
            showInlineError(field.id, valCheck.errorMsg);
            inputs.css('border-color', '#dc3545');
            return { isValid: false, errorMsg: valCheck.errorMsg };
          }
        }

        // Date constraints check
        if (field.type === 'date' && answerVal) {
          const dateConstraints = field.dateConstraints;
          if (dateConstraints) {
            const chosenDate = new Date(answerVal);
            const getLocalDateString = (d) => {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              return `${year}-${month}-${day}`;
            };
            const chosenStr = getLocalDateString(chosenDate);
            const today = new Date();
            const todayStr = getLocalDateString(today);

            let minDateStr = null;
            if (dateConstraints.minType === 'today') {
              minDateStr = todayStr;
            } else if (dateConstraints.minType === 'tomorrow') {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              minDateStr = getLocalDateString(tomorrow);
            } else if (dateConstraints.minType === 'fixed' && dateConstraints.minFixed) {
              minDateStr = dateConstraints.minFixed;
            }

            // Once date settings exist for a field, never allow a date before today,
            // regardless of the configured minType (including "no minimum" or a past fixed date).
            if (!minDateStr || minDateStr < todayStr) {
              minDateStr = todayStr;
            }

            if (minDateStr && chosenStr < minDateStr) {
              const msg = `Date must be on or after ${minDateStr}`;
              showInlineError(field.id, msg);
              inputs.css('border-color', '#dc3545');
              return { isValid: false, errorMsg: msg };
            }

            let maxDateStr = null;
            if (dateConstraints.maxType === 'today') {
              maxDateStr = todayStr;
            } else if (dateConstraints.maxType === 'fixed' && dateConstraints.maxFixed) {
              maxDateStr = dateConstraints.maxFixed;
            }

            if (maxDateStr && chosenStr > maxDateStr) {
              const msg = `Date must be on or before ${maxDateStr}`;
              showInlineError(field.id, msg);
              inputs.css('border-color', '#dc3545');
              return { isValid: false, errorMsg: msg };
            }

            if (dateConstraints.cutoffHour !== null && dateConstraints.cutoffHour !== undefined) {
              const now = new Date();
              const nowStr = getLocalDateString(now);
              const cutoffDay = new Date(chosenStr);
              cutoffDay.setDate(cutoffDay.getDate() - 1);
              const cutoffDayStr = getLocalDateString(cutoffDay);

              const currentHour = now.getHours();
              if (nowStr > cutoffDayStr || (nowStr === cutoffDayStr && currentHour >= dateConstraints.cutoffHour)) {
                const msg = `Booking/Selection for ${chosenStr} has closed (Cutoff was ${dateConstraints.cutoffHour}:00 of previous day)`;
                showInlineError(field.id, msg);
                inputs.css('border-color', '#dc3545');
                return { isValid: false, errorMsg: msg };
              }
            }
          }
        }

        // Valid
        clearInlineError(field.id);
        inputs.css('border-color', '#ced4da');
        return { isValid: true };
      }

      let isOtpVerified = urlParams.get('responseId') ? true : false;
      let lastCheckedAuthVal = '';
      let lookupTimeout = null;

      function checkAuthInputValidation(inputEl) {
        const id = $(inputEl).attr('id');
        const val = inputEl.value.trim();
        const isMob = id === 'input_mobno';
        const errorId = isMob ? 'mobno' : 'cardno';
        const infoId = `info_${errorId}`;
        
        if (!val) {
          showInlineError(errorId, `${isMob ? 'Mobile Number' : 'Card Number'} is required`);
          $(`#${infoId}`).remove();
          $(inputEl).css('border-color', '#dc3545');
          if (formData.requireOtp && isMob) {
            $('#sendOtpBtn').hide();
            $('#otpInputSection').hide();
            isOtpVerified = false;
          }
          return false;
        }

        if (isMob) {
          const clean = val.replace(/\D/g, '');
          if (clean.length !== 10) {
            showInlineError(errorId, `Invalid format. Please enter a 10-digit number.`);
            $(`#${infoId}`).remove();
            $(inputEl).css('border-color', '#dc3545');
            if (formData.requireOtp) {
              $('#sendOtpBtn').hide();
              $('#otpInputSection').hide();
              isOtpVerified = false;
            }
            return false;
          }
        }

        clearInlineError(errorId);
        $(inputEl).css('border-color', '#ced4da');
        if (formData.requireOtp && isMob && val !== lastCheckedAuthVal) {
          $('#sendOtpBtn').hide();
          $('#otpInputSection').hide();
          isOtpVerified = false;
        }

        // Debounced identity resolution
        clearTimeout(lookupTimeout);
        lookupTimeout = setTimeout(async () => {
          if (val === lastCheckedAuthVal) return;
          lastCheckedAuthVal = val;
          
          $(`#${infoId}`).remove();
          
          try {
            // Renders loading label
            $(inputEl).after(`
              <div id="${infoId}" style="color: #6c757d; font-size: 0.85rem; margin-top: 0.35rem;">
                <i class="fas fa-spinner fa-spin"></i> Checking registration...
              </div>
            `);
            
            const type = isMob ? 'mobno' : 'cardno';
            const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/resolve-identity?type=${type}&value=${encodeURIComponent(val)}`);
            const data = await res.json();
            
            $(`#${infoId}`).remove();
            
            if (data.success) {
              $(inputEl).css('border-color', '#28a745');
              $(inputEl).after(`
                <div id="${infoId}" style="color: #28a745; font-size: 0.88rem; margin-top: 0.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
                  <i class="fas fa-check-circle"></i> Registered to: ${data.data.name} (${data.data.center || 'No Center'})
                </div>
              `);
              
              if (formData.requireOtp && isMob) {
                $('#sendOtpBtn').show();
              }
            } else {
              showInlineError(errorId, data.message || 'Not registered');
              $(inputEl).css('border-color', '#dc3545');
              if (formData.requireOtp && isMob) {
                $('#sendOtpBtn').hide();
                $('#otpInputSection').hide();
                isOtpVerified = false;
              }
            }
          } catch (err) {
            console.error('Error checking registration:', err);
            $(`#${infoId}`).remove();
          }
        }, 400);

        return true;
      }

      function validateAndGoToPage(from, to) {
        const pageContainer = document.getElementById(`formPage_${from}`);
        
        let isValid = true;
        let firstInvalidMsg = '';

        if (from === 0 && !formData.isPublic) {
          const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
          if (authInput) {
            const isAuthValid = checkAuthInputValidation(authInput);
            if (!isAuthValid) {
              isValid = false;
              firstInvalidMsg = document.getElementById('input_mobno') ? 'Mobile Number is required' : 'Card Number is required';
            } else if (formData.requireOtp && authInput.id === 'input_mobno' && !isOtpVerified) {
              isValid = false;
              firstInvalidMsg = 'Please verify your mobile number using OTP first';
            }
          }
        }

        const visibleGroups = $(pageContainer).find('.field-group:visible');
        visibleGroups.each(function() {
          const check = checkFieldValidation(this);
          if (!check.isValid) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = check.errorMsg;
          }
        });

        if (!isValid) {
          showFormAlertOnPage(from, firstInvalidMsg || 'Please correct the errors in the form', 'danger');
          return;
        }

        // Clear general alert if valid
        const alert = document.getElementById(`formAlert_${from}`);
        if (alert) alert.style.display = 'none';

        goToPage(to);
      }

      function showFormAlertOnPage(pageIdx, msg, type) {
        const alert = document.getElementById(`formAlert_${pageIdx}`);
        if (!alert) return;
        alert.className = `alert-${type}`;
        alert.textContent = msg;
        alert.style.display = 'block';
        window.scrollTo({ top: alert.offsetTop - 50, behavior: 'smooth' });
      }

      function renderField(field) {
        const requiredMark = field.required ? '<span class="required">*</span>' : '';
        const requiredAttr = field.required ? 'required' : '';
        const inputId = `input_${field.id}`;
        let inputHtml = '';

        if (field.type === 'text') {
          inputHtml = `<input type="text" id="${inputId}" placeholder="Your answer" data-word-limit="20" maxlength="200" ${requiredAttr} />`;
        } else if (field.type === 'textarea') {
          inputHtml = `<textarea id="${inputId}" rows="4" placeholder="Your answer" ${requiredAttr}></textarea>`;
        } else if (field.type === 'number') {
          inputHtml = `<input type="number" id="${inputId}" placeholder="Your answer" ${requiredAttr} />`;
        } else if (field.type === 'date') {
          let minAttr = '';
          let maxAttr = '';
          if (field.dateConstraints) {
            const today = new Date();
            const getLocalDateString = (d) => {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              return `${year}-${month}-${day}`;
            };
            const todayStr = getLocalDateString(today);
            let computedMin = null;
            if (field.dateConstraints.minType === 'today') {
              computedMin = todayStr;
            } else if (field.dateConstraints.minType === 'tomorrow') {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              computedMin = getLocalDateString(tomorrow);
            } else if (field.dateConstraints.minType === 'fixed' && field.dateConstraints.minFixed) {
              computedMin = field.dateConstraints.minFixed;
            }
            // Once date settings exist for a field, never allow picking a date before today,
            // regardless of the configured minType (including "no minimum" or a past fixed date).
            if (!computedMin || computedMin < todayStr) {
              computedMin = todayStr;
            }
            minAttr = `min="${computedMin}"`;

            if (field.dateConstraints.maxType === 'today') {
              maxAttr = `max="${todayStr}"`;
            } else if (field.dateConstraints.maxType === 'fixed' && field.dateConstraints.maxFixed) {
              maxAttr = `max="${field.dateConstraints.maxFixed}"`;
            }
          }
          inputHtml = `<input type="date" id="${inputId}" ${minAttr} ${maxAttr} ${requiredAttr} style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; background-color: #fafafa;" />`;
        } else if (field.type === 'time') {
          inputHtml = `<input type="time" id="${inputId}" ${requiredAttr} style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; background-color: #fafafa;" />`;
        } else if (field.type === 'rating') {
          inputHtml = `
            <div class="star-rating" data-id="${field.id}">
              <span class="star" data-val="1">★</span>
              <span class="star" data-val="2">★</span>
              <span class="star" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star" data-val="5">★</span>
              <input type="hidden" id="${inputId}" class="input-rating-val" ${requiredAttr} />
            </div>
          `;
        } else if (field.type === 'select') {
          const options = field.options || [];
          inputHtml = `
            <select id="${inputId}" ${requiredAttr}>
              <option value="">-- Choose Option --</option>
              ${options.map(opt => `<option value="${escapeAttr(opt)}">${escapeHtml(opt)}</option>`).join('')}
            </select>
          `;
        } else if (field.type === 'radio') {
          const options = field.options || [];
          inputHtml = options.map((opt, oi) => `
            <div class="option-item">
              <input type="radio" name="${field.id}" id="${inputId}_${oi}" value="${escapeAttr(opt)}" ${requiredAttr} />
              <label for="${inputId}_${oi}">${escapeHtml(opt)}</label>
            </div>
          `).join('');
        } else if (field.type === 'checkbox') {
          const options = field.options || [];
          inputHtml = options.map((opt, oi) => `
            <div class="option-item">
              <input type="checkbox" name="${field.id}" id="${inputId}_${oi}" value="${escapeAttr(opt)}" />
              <label for="${inputId}_${oi}">${escapeHtml(opt)}</label>
            </div>
          `).join('');
        } else if (field.type === 'grid_radio' || field.type === 'grid_checkbox') {
          const rows = field.rows || [];
          const cols = field.columns || [];
          const isRadio = field.type === 'grid_radio';

          let tableHtml = `
            <div style="overflow-x: auto;">
              <table class="grid-table">
                <thead>
                  <tr>
                    <th>Row</th>
                    ${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
          `;

          rows.forEach((r, ri) => {
            tableHtml += `
              <tr>
                <td>${escapeHtml(r)}</td>
                ${cols.map((c, ci) => `
                  <td>
                    <input type="${isRadio ? 'radio' : 'checkbox'}" 
                      name="response_${field.id}_${ri}" 
                      value="${escapeAttr(c)}" 
                      class="grid-input"
                      data-field-id="${field.id}"
                      data-row-index="${ri}" />
                  </td>
                `).join('')}
              </tr>
            `;
          });

          tableHtml += `
                </tbody>
              </table>
            </div>
          `;
          inputHtml = tableHtml;
        }

        return `
          <div class="field-group" data-field-id="${field.id}">
            <label for="${inputId}" style="margin-bottom:0.25rem;">${renderRichText(field.label)} ${requiredMark}</label>
            ${field.description ? `<p style="font-size:0.8rem; color:#6c757d; margin-top:-0.15rem; margin-bottom:0.5rem; font-weight:400; line-height:1.4;">${renderRichText(field.description)}</p>` : ''}
            ${inputHtml}
            ${field.type === 'text' ? `<div class="word-count-hint" id="wordCount_${field.id}" style="font-size:0.78rem; color:#6c757d; margin-top:0.3rem; text-align:right;">0/20 words</div>` : ''}
            <div class="inline-error-msg" id="error_${field.id}" style="color: #dc3545; font-size: 0.82rem; margin-top: 0.35rem; display: none; font-weight: 500;"><i class="fas fa-exclamation-circle"></i> <span></span></div>
          </div>
        `;
      }

      function initStarRatings() {
        $('.star-rating .star').on('click', function() {
          const val = $(this).data('val');
          const parent = $(this).parent();
          parent.find('.input-rating-val').val(val).trigger('change');
          
          parent.find('.star').removeClass('selected');
          $(this).addClass('selected').prevAll().addClass('selected');
        });

        $('.star-rating .star').on('mouseenter', function() {

        });

      function evaluateLogic() {
        if (!formData || !formData.fields) return;

        formData.fields.forEach(field => {
          let hasLogic = false;
          let show = true;

          // Support conditions array format
          if (field.conditions && Array.isArray(field.conditions) && field.conditions.length > 0) {
            hasLogic = true;
            show = field.conditions.every(cond => {
              const depField = formData.fields.find(f => f.id === cond.fieldId);
              if (!depField) return true;
              
              const currentVal = getFieldValue(depField);
              const targetVal = cond.value;
              const op = cond.operator || 'equals';

              if (op === 'equals') {
                if (Array.isArray(currentVal)) return currentVal.includes(targetVal);
                return String(currentVal) === String(targetVal);
              } else if (op === 'not_equals') {
                if (Array.isArray(currentVal)) return !currentVal.includes(targetVal);
                return String(currentVal) !== String(targetVal);
              } else if (op === 'contains') {
                const currentStr = Array.isArray(currentVal) ? currentVal.join(',') : String(currentVal);
                return currentStr.toLowerCase().includes(targetVal.toLowerCase());
              }
              return true;
            });
          } 
          // Backward compatibility for old single condition logic format
          else if (field.logic) {
            hasLogic = true;
            const dependsOn = field.logic.dependsOn;
            const targetVal = field.logic.value;
            const op = field.logic.operator || 'equals';
            const depField = formData.fields.find(f => f.id === dependsOn);

            if (depField) {
              const currentVal = getFieldValue(depField);
              if (op === 'equals') {
                if (Array.isArray(currentVal)) show = currentVal.includes(targetVal);
                else show = String(currentVal) === String(targetVal);
              } else if (op === 'not_equals') {
                if (Array.isArray(currentVal)) show = !currentVal.includes(targetVal);
                else show = String(currentVal) !== String(targetVal);
              } else if (op === 'contains') {
                const currentStr = Array.isArray(currentVal) ? currentVal.join(',') : String(currentVal);
                show = currentStr.toLowerCase().includes(targetVal.toLowerCase());
              }
            } else {
              show = true;
            }
          }

          if (hasLogic) {
            const group = $(`.field-group[data-field-id="${field.id}"]`);
            const pageContainer = group.closest('.form-page');
            const pageIdx = pageContainer.length > 0 ? parseInt(pageContainer.attr('id').split('_')[1]) : 0;
            const isOnActivePage = (pageIdx === window.currentPageIdx);

            if (show) {
              group.removeClass('conditional-hidden');
              if (isOnActivePage) {
                if (group.css('display') === 'none') {
                  group.slideDown(250);
                }
              } else {
                group.css('display', '');
              }
            } else {
              group.addClass('conditional-hidden');
              if (isOnActivePage) {
                if (group.css('display') !== 'none') {
                  group.slideUp(250, function() {
                    clearFieldValue(field);
                  });
                } else {
                  clearFieldValue(field);
                }
              } else {
                group.css('display', 'none');
                clearFieldValue(field);
              }
            }
          }
        });
      }

      function getFieldValue(field) {
        const inputId = `input_${field.id}`;
        if (field.type === 'checkbox') {
          const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
          return Array.from(checked).map(c => c.value);
        } else if (field.type === 'radio') {
          const selected = document.querySelector(`input[name="${field.id}"]:checked`);
          return selected ? selected.value : '';
        } else {
          const el = document.getElementById(inputId);
          return el ? el.value : '';
        }
      }

      function clearFieldValue(field) {
        const inputId = `input_${field.id}`;
        if (field.type === 'checkbox' || field.type === 'radio') {
          $(`input[name="${field.id}"]`).prop('checked', false).trigger('change');
        } else if (field.type === 'rating') {
          $(`#${inputId}`).val('').trigger('change');
          $(`.star-rating[data-id="${field.id}"] .star`).removeClass('selected');
        } else if (field.type === 'grid_radio' || field.type === 'grid_checkbox') {
          $(`input[name^="response_${field.id}_"]`).prop('checked', false);
        } else {
          $(`#${inputId}`).val('').trigger('change');
        }
      }

      $(document).on('keydown', 'input[data-word-limit]', function(e) {
        // Once the word limit is reached: block whitespace (which would start
        // a new word), and let the user keep typing the word they're already
        // on, but only up to a sane length — otherwise holding a key down
        // lets a single "word" grow forever even though the count stays
        // at the cap.
        if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) {
          return;
        }
        const hasSelection = this.selectionStart !== this.selectionEnd;
        if (hasSelection) {
          return;
        }
        const maxWords = parseInt($(this).attr('data-word-limit'), 10);
        const words = this.value.split(/\s+/).filter(Boolean);
        const currentWords = words.length;
        if (currentWords < maxWords) {
          return;
        }

        const isWhitespace = /\s/.test(e.key);
        if (isWhitespace) {
          e.preventDefault();
          return;
        }

        const MAX_LAST_WORD_LENGTH = 25;
        const lastWord = words[words.length - 1] || '';
        if (lastWord.length >= MAX_LAST_WORD_LENGTH) {
          e.preventDefault();
        }
      });

      $(document).on('input', 'input[data-word-limit]', function() {
        const maxWords = parseInt($(this).attr('data-word-limit'), 10);
        const words = this.value.split(/\s+/).filter(Boolean);
        if (words.length > maxWords) {
          this.value = words.slice(0, maxWords).join(' ');
        }

        const fieldId = $(this).closest('.field-group').data('field-id');
        const countEl = document.getElementById(`wordCount_${fieldId}`);
        if (countEl) {
          const currentCount = this.value.split(/\s+/).filter(Boolean).length;
          countEl.textContent = `${currentCount}/${maxWords} words`;
          countEl.style.color = currentCount >= maxWords ? '#dc3545' : '#6c757d';
        }
      });

      $(document).on('change input blur', 'input, select, textarea', function() {
        // Find the parent field group
        const group = $(this).closest('.field-group');
        if (group.length > 0) {
          checkFieldValidation(group[0]);
        }
        
        // Also check if it's the auth section input
        if ($(this).attr('id') === 'input_cardno' || $(this).attr('id') === 'input_mobno') {
          checkAuthInputValidation(this);
        }
        
        evaluateLogic();
      });

      $(document).on('click', '#sendOtpBtn', async function() {
        const mobno = document.getElementById('input_mobno').value.trim();
        const sendBtn = this;
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/otp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobno })
          });
          const data = await res.json();
          if (data.success) {
            alert('OTP sent successfully to your WhatsApp!');
            $('#otpInputSection').slideDown();
            sendBtn.textContent = 'Resend OTP';
          } else {
            alert(data.message || 'Failed to send OTP. Please try again.');
            sendBtn.textContent = 'Send OTP';
          }
        } catch (e) {
          console.error(e);
          alert('Error sending OTP. Please check your network connection.');
          sendBtn.textContent = 'Send OTP';
        } finally {
          sendBtn.disabled = false;
        }
      });

      $(document).on('click', '#verifyOtpBtn', async function() {
        const mobno = document.getElementById('input_mobno').value.trim();
        const otp = document.getElementById('input_otp').value.trim();
        const verifyBtn = this;

        if (!otp || otp.length !== 6) {
          alert('Please enter a valid 6-digit OTP');
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';

        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/otp/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobno, otp })
          });
          const data = await res.json();
          if (data.success) {
            isOtpVerified = true;
            alert('OTP verified successfully!');
            $('#input_mobno').prop('readonly', true).css('background-color', '#e9ecef');
            $('#input_otp').prop('readonly', true).css('background-color', '#e9ecef');
            $('#sendOtpBtn').hide();
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verified ✓';
            verifyBtn.style.backgroundColor = '#28a745';
          } else {
            alert(data.message || 'Invalid OTP. Please try again.');
            verifyBtn.textContent = 'Verify';
            verifyBtn.disabled = false;
          }
        } catch (e) {
          console.error(e);
          alert('Error verifying OTP.');
          verifyBtn.textContent = 'Verify';
          verifyBtn.disabled = false;
        }
      });

      async function submitForm(e) {
        e.preventDefault();

        const currentPageIdx = window.currentPageIdx;
        const submitBtn = document.querySelector(`#formPage_${currentPageIdx} #submitBtn`) || document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Submitting...';
        }

        const responses = {};
        const fields = formData.fields;

        // Perform final page validation on the current active page
        const pageContainer = document.getElementById(`formPage_${currentPageIdx}`);
        let isValid = true;
        let firstInvalidMsg = '';

        if (currentPageIdx === 0 && !formData.isPublic) {
          const authInput = document.getElementById('input_mobno') || document.getElementById('input_cardno');
          if (authInput) {
            const isAuthValid = checkAuthInputValidation(authInput);
            if (!isAuthValid) {
              isValid = false;
              firstInvalidMsg = document.getElementById('input_mobno') ? 'Mobile Number is required' : 'Card Number is required';
            } else if (formData.requireOtp && authInput.id === 'input_mobno' && !isOtpVerified) {
              isValid = false;
              firstInvalidMsg = 'Please verify your mobile number using OTP first';
            }
          }
        }

        const visibleGroups = $(pageContainer).find('.field-group:visible');
        visibleGroups.each(function() {
          const check = checkFieldValidation(this);
          if (!check.isValid) {
            isValid = false;
            if (!firstInvalidMsg) firstInvalidMsg = check.errorMsg;
          }
        });

        if (!isValid) {
          showFormAlertOnPage(currentPageIdx, firstInvalidMsg || 'Please correct the errors in the form', 'danger');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
          return;
        }

        // Clear general alert if valid
        const alert = document.getElementById(`formAlert_${currentPageIdx}`);
        if (alert) alert.style.display = 'none';

        // Collect responses across ALL pages
        fields.forEach(field => {
          if (field.type === 'section') return;

          const group = $(`.field-group[data-field-id="${field.id}"]`);
          if (group.hasClass('conditional-hidden')) return; // Do not submit hidden fields

          if (field.type === 'checkbox') {
            const checked = document.querySelectorAll(`input[name="${field.id}"]:checked`);
            responses[field.id] = Array.from(checked).map(c => c.value);
          } else if (field.type === 'radio') {
            const selected = document.querySelector(`input[name="${field.id}"]:checked`);
            responses[field.id] = selected ? selected.value : '';
          } else if (field.type === 'grid_radio') {
            const rowAnswers = {};
            field.rows.forEach((r, ri) => {
              const checked = document.querySelector(`input[name="response_${field.id}_${ri}"]:checked`);
              rowAnswers[r] = checked ? checked.value : '';
            });
            responses[field.id] = rowAnswers;
          } else if (field.type === 'grid_checkbox') {
            const rowAnswers = {};
            field.rows.forEach((r, ri) => {
              const checked = document.querySelectorAll(`input[name="response_${field.id}_${ri}"]:checked`);
              rowAnswers[r] = Array.from(checked).map(c => c.value);
            });
            responses[field.id] = rowAnswers;
          } else {
            const el = document.getElementById(`input_${field.id}`);
            responses[field.id] = el ? el.value.trim() : '';
          }
        });

        const body = { responses };

        if (urlParams.get('preview') === 'true') {
          showFormAlertOnPage(currentPageIdx, 'Validation Passed! This is a preview, so no response was recorded.', 'success');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
          return;
        }

        if (!formData.isPublic) {
          if (formData.authType === 'mobno') {
            const mobno = document.getElementById('input_mobno')?.value?.trim();
            if (!mobno) {
              showFormAlertOnPage(currentPageIdx, 'Mobile Number is required', 'danger');
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Response';
              }
              return;
            }
            body.mobno = mobno;
          } else {
            const cardno = document.getElementById('input_cardno')?.value?.trim();
            if (!cardno) {
              showFormAlertOnPage(currentPageIdx, 'Card Number is required', 'danger');
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Response';
              }
              return;
            }
            body.cardno = cardno;
          }
        }

        try {
          const responseId = urlParams.get('responseId');
          const isEdit = responseId && formData.allowEdit;

          const url = isEdit
            ? `${CONFIG.baseUrl}/admin/forms/public/${formId}/responses/${responseId}`
            : `${CONFIG.baseUrl}/admin/forms/public/${formId}/submit`;

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          const data = await res.json();

          if (data.success) {
            if (!isEdit && formData.limitOneResponse) {
              localStorage.setItem(`form_submitted_${formId}`, 'true');
            }
            showSuccessScreen(data.data?.id || responseId);
          } else {
            showFormAlertOnPage(currentPageIdx, data.message || 'Failed to submit response', 'danger');
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit Response';
            }
          }
        } catch (err) {
          showFormAlertOnPage(currentPageIdx, 'Network error. Please try again.', 'danger');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Response';
          }
        }
      }

      function showSuccessScreen(respId) {
        const container = document.getElementById('formContainer');
        const isEdit = urlParams.get('responseId') ? true : false;
        
        let actionsHtml = '';
        
        // Edit Response button
        if (formData.allowEdit && respId) {
          actionsHtml += `
            <a href="view.html?id=${formId}&responseId=${respId}" class="submit-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; width:240px; text-align:center; margin:0.5rem; box-sizing:border-box;">
              <i class="fas fa-edit"></i> Edit Response
            </a>
          `;
        }

        // Submit Another Response link
        const alreadySubmittedLimit = formData.limitOneResponse && !formData.allowEdit;
        if (formData.showSubmitAnother && !alreadySubmittedLimit) {
          actionsHtml += `
            <a href="view.html?id=${formId}" class="submit-btn" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; width:240px; text-align:center; background-color:#6c757d; margin:0.5rem; box-sizing:border-box;">
              <i class="fas fa-redo"></i> Submit another response
            </a>
          `;
        }

        const msgText = formData.confirmationMessage || 'Thank you for filling out the form. Your response has been recorded.';

        container.innerHTML = `
          <div class="success-screen">
            <div class="success-icon" style="color:#28a745;">✓</div>
            <h2>${isEdit ? 'Response Updated!' : 'Response Submitted!'}</h2>
            <p>${renderRichText(msgText)}</p>
            <div style="margin-top:2rem; display:flex; justify-content:center; flex-wrap:wrap; gap:0.5rem;">
              ${actionsHtml}
            </div>
          </div>
        `;
      }

      function showAlreadySubmittedState() {
        const container = document.getElementById('formContainer');
        container.innerHTML = `
          <div class="success-screen">
            <div class="success-icon" style="color:#ffc107;">⚠️</div>
            <h2>Already Submitted</h2>
            <p>You have already submitted a response to this form. Each user is limited to one response.</p>
          </div>
        `;
      }

      async function loadAndPopulateResponse(responseId) {
        try {
          const res = await fetch(`${CONFIG.baseUrl}/admin/forms/public/${formId}/responses/${responseId}`);
          const data = await res.json();

          if (!data.success) {
            showFormAlertOnPage(0, 'Failed to load your previous response for editing.', 'danger');
            return;
          }

          populateFormFields(data.data);
        } catch (err) {
          showFormAlertOnPage(0, 'Failed to load your previous response due to a network error.', 'danger');
        }
      }

      function populateFormFields(responseObj) {
        const answers = responseObj.responses || {};
        if (responseObj.respondent?.mobno && document.getElementById('input_mobno')) {
          const mob = responseObj.respondent.mobno;
          document.getElementById('input_mobno').value = mob;
          document.getElementById('input_mobno').readOnly = true;
          document.getElementById('input_mobno').style.backgroundColor = '#e9ecef';
          $('#input_mobno').after(`
            <div id="info_mobno" style="color: #28a745; font-size: 0.88rem; margin-top: 0.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
              <i class="fas fa-check-circle"></i> Registered to: ${responseObj.respondent.issuedto || 'Registered User'} (${responseObj.respondent.center || 'No Center'})
            </div>
          `);
        } else if (responseObj.cardno && document.getElementById('input_cardno')) {
          const card = responseObj.cardno;
          document.getElementById('input_cardno').value = card;
          document.getElementById('input_cardno').readOnly = true;
          document.getElementById('input_cardno').style.backgroundColor = '#e9ecef';
          $('#input_cardno').after(`
            <div id="info_cardno" style="color: #28a745; font-size: 0.88rem; margin-top: 0.35rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
              <i class="fas fa-check-circle"></i> Registered to: ${responseObj.respondent?.issuedto || 'Registered User'} (${responseObj.respondent?.center || 'No Center'})
            </div>
          `);
        }

        formData.fields.forEach(field => {
          const ans = answers[field.id];
          if (ans === undefined || ans === null) return;

          const inputId = `input_${field.id}`;

          if (field.type === 'checkbox') {
            const vals = Array.isArray(ans) ? ans : [ans];
            vals.forEach(v => {
              $(`input[name="${field.id}"][value="${v}"]`).prop('checked', true);
            });
          } else if (field.type === 'radio') {
            $(`input[name="${field.id}"][value="${ans}"]`).prop('checked', true);
          } else if (field.type === 'rating') {
            const val = parseInt(ans);
            const parent = $(`.star-rating[data-id="${field.id}"]`);
            parent.find('.input-rating-val').val(val);
            parent.find('.star').each(function() {
              if ($(this).data('val') <= val) {
                $(this).addClass('selected');
              }
            });
          } else if (field.type === 'grid_radio') {
            const gridAns = ans || {};
            field.rows.forEach((r, ri) => {
              const rowVal = gridAns[r];
              if (rowVal) {
                $(`input[name="response_${field.id}_${ri}"][value="${rowVal}"]`).prop('checked', true);
              }
            });
          } else if (field.type === 'grid_checkbox') {
            const gridAns = ans || {};
            field.rows.forEach((r, ri) => {
              const rowVals = gridAns[r] || [];
              rowVals.forEach(v => {
                $(`input[name="response_${field.id}_${ri}"][value="${v}"]`).prop('checked', true);
              });
            });
          } else {
            const el = document.getElementById(inputId);
            if (el) el.value = ans;
          }
        });

        evaluateLogic();
      }

      function showErrorState(message) {
        const container = document.getElementById('formContainer');
        container.innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>An Error Occurred</h2>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }

      function escapeAttr(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Start fetching on load
      loadForm();
    </script>
  </body>
</html>
