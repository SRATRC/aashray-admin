<!-- Keep all your original includes intact -->
<script src="/style/js/roleCheck.js"></script>
<script>
  checkRoleAccess(['utsavAdmin', 'superAdmin', 'utsavAdminReadOnly', 'utsavAdminRaj']);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utsav Bookings</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <link rel="stylesheet" href="../../style/css/styles.css" />
  <script src="../../style/js/plugin.js"></script>
  <script src="../../style/js/bootstrap-datepicker.min.js"></script>
  <script src="../../style/js/clockpicker.js"></script>
  <script src="../../style/js/custom.js"></script>
  <script src="../../style/js/config.js"></script>
  <script src="/sessionstorage.js"></script>
  <script src="../../style/js/exportToExcel.js"></script>
  <script src="utsavBookingslist.js"></script>
  <script src="../../style/js/tableSortFilter.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div class="header">
    <div class="container">
      <div class="logout">
        <a href="javascript:void(0);" onclick="history.back()">Back</a> &nbsp; | &nbsp;
        <a href="javascript:void(0);" onclick="goToHome()">Home</a> &nbsp; | &nbsp;
        <a href="javascript:void(0);" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <div class="middlecontent">
    <div class="container">
      <div class="whitesec">
        <div class="inner-padding">
          <div class="frm-head">
            <h1>Utsav Bookings <span id="utsavName"></span></h1>
          </div>

          <div class="form">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
              <label for="packageFilter"><b>Filter by Package:</b></label>
              <select id="packageFilter"></select>
              <button id="downloadAll" class="btn btn-primary">Download All Registrations</button>
              <button id="systemRoomAllocationBtn" class="btn btn-success" style="background-color: #28a745; border-color: #28a745;">System Room Allocation</button>
              <button id="downloadPackage" class="btn btn-primary">Download This Package Registrations</button>
              <button id="centerSummaryBtn" class="btn btn-secondary">Center-wise & Package-wise Summary</button>
            </div>

            <input type="text" id="tableSearch" class="form-control search-box" placeholder="Search...">
            <div class="table-responsive" id="tableContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Center-wise Summary Modal -->
  <div id="centerSummaryModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Center-wise & Package-wise Summary</h3>
      <p style="font-size:13px;color:#666;margin-bottom:10px;">
  Click on a center row to view package-wise breakup
</p>
      <div id="centerSummaryTableContainer"></div>
    </div>
  </div>

  <!-- RoomNo Modal -->
  <div id="roomNoModal" class="modal" style="display:none;">
    <div class="modal-content whitesec">
      <span class="close" id="closeRoomNoModal">&times;</span>
      <div class="inner-padding">
        <div class="frm-head"><h3>Update Room No</h3></div>
        <form id="roomNoForm" class="form">
          <div class="form-group"><label>Booking ID:</label><input type="text" id="modalBookingId" class="form-control" readonly /></div>
          <div class="form-group"><label>Card No:</label><input type="text" id="modalCardno" class="form-control" readonly /></div>
          <div class="form-group"><label>Name:</label><input type="text" id="modalName" class="form-control" readonly /></div>
          <div class="form-group"><label>Room No:</label><input type="text" id="modalRoomno" class="form-control" required /></div>
          <button type="submit" class="btn btn-primary">Update</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Booking Status Update Modal -->
  <div id="statusModal" class="modal" style="display:none;">
    <div class="modal-content whitesec">
      <span class="close" id="closeStatusModal">&times;</span>
      <div class="inner-padding">
        <div class="frm-head"><h3>Update Booking Status</h3></div>
        <form id="statusModalForm" class="form">
          <div class="form-group"><label>Utsav ID:</label><input type="text" id="modalUtsavId" class="form-control" readonly /></div>
          <div class="form-group"><label>Booking ID:</label><input type="text" id="modalBookingIdStatus" class="form-control" readonly /></div>
          <div class="form-group">
            <label>Status:</label>
            <select id="modalStatus" class="form-control" required>
              <option value="confirmed">Confirmed</option>
              <option value="admin cancelled">Admin Cancelled</option>
              <option value="pending">Payment Pending</option>
              <option value="waiting">Waiting</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description:</label>
            <textarea id="modalDescription" rows="4" class="form-control"></textarea>
          </div>
          <!-- Credits to be issued dropdown (added dynamically via JS) -->
          <button type="submit" class="btn btn-primary">Update Status</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Change Package Modal -->
  <div id="changePackageModal" class="modal" style="display:none;">
    <div class="modal-content whitesec">
      <span class="close" id="closeChangePackageModal">&times;</span>
      <div class="inner-padding">
        <div class="frm-head"><h3>Change Utsav Package</h3></div>
        <form id="changePackageForm" class="form">
          <div class="form-group">
            <label>Booking ID:</label>
            <input type="text" id="cpModalBookingId" class="form-control" readonly />
          </div>
          <div class="form-group">
            <label>Card No / Name:</label>
            <input type="text" id="cpModalCardAndName" class="form-control" readonly />
          </div>
          <div class="form-group">
            <label>Current Package:</label>
            <input type="text" id="cpModalCurrentPackage" class="form-control" readonly />
          </div>
          <div class="form-group">
            <label>New Package:</label>
            <select id="cpModalNewPackage" class="form-control" required>
              <option value="">-- Select New Package --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Room No (optional):</label>
            <input type="text" id="cpModalRoomNo" class="form-control" placeholder="Enter room number or leave blank" />
          </div>
          <div class="form-group">
            <label>Remarks / Description (optional):</label>
            <textarea id="cpModalDescription" rows="3" class="form-control" placeholder="Reason for package change..."></textarea>
          </div>
          <button type="submit" id="cpModalSubmitBtn" class="btn btn-primary">Change Package</button>
        </form>
      </div>
    </div>
  </div>

  <style>
    .modal {position: fixed; z-index: 999; left:0; top:0; width:100%; height:100%; overflow:auto; background-color: rgba(0,0,0,0.4);}
    .modal-content {max-width: 600px; margin:5% auto; padding:20px; background:white; border-radius:10px; position:relative;}
    .modal-content span {position:absolute; top:10px; right:20px; font-size:24px; cursor:pointer;}
    #centerSummaryTableContainer table {width:100%; border-collapse:collapse;}
    #centerSummaryTableContainer th, #centerSummaryTableContainer td {border:1px solid #ccc; padding:8px; text-align:center;}
    #centerSummaryTableContainer th {
  background-color: #1f3c60; /* same as page headers */
  color: #ffffff;
  font-weight: bold;
}

    /* Action Column & Buttons */
    th.action-th, td.action-td {
      min-width: 140px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap !important;
    }
    .action-btn-group {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
      width: 100%;
      max-width: 145px;
      margin: 0 auto;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.2;
      border-radius: 5px;
      text-decoration: none !important;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease-in-out;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .btn-action:focus {
      outline: none;
    }
    .btn-action-status {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }
    .btn-action-status:hover {
      background-color: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.25);
      transform: translateY(-1px);
    }
    .btn-action-package {
      background-color: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    .btn-action-package:hover {
      background-color: #047857;
      color: #ffffff;
      border-color: #047857;
      box-shadow: 0 2px 6px rgba(4, 120, 87, 0.25);
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(0);
    }

  </style>
</body>
</html>
