<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Keep all your original includes intact -->
    <script src="/style/js/roleCheck.js"></script>

    <script>
        checkRoleAccess([
            'utsavAdmin',
            'superAdmin',
            'utsavAdminReadOnly',
            'utsavAdminRaj'
        ]);
    </script>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Utsav Feedbacks</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

    <link rel="stylesheet" href="../../style/css/styles.css" />

    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/bootstrap-datepicker.min.js"></script>
    <script src="../../style/js/clockpicker.js"></script>
    <script src="../../style/js/custom.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="/sessionstorage.js"></script>
    <script src="../../style/js/tableSortFilter.js"></script>
    <script src="../../style/js/exportToExcel.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <script src="fetchUtsavFeedbacks.js"></script>

    <style>
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 24px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .custom-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        .custom-modal-close:hover {
            color: #000;
        }

        .summary-table {
            width: 100% !important;
            min-width: 0 !important;
            table-layout: auto !important;
            border-collapse: collapse !important;
            margin-top: 10px !important;
        }

        .summary-table th, .summary-table td {
            padding: 10px 12px !important;
            border: 1px solid #dee2e6 !important;
            text-align: left;
        }

        .summary-table th {
            background-color: #204060 !important;
            color: #ffffff !important;
        }

        .feedback-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
    </style>

</head>

<body>

    <div class="header">

        <div class="container">

            <div class="logout">
                <a href="javascript:void(0);" onclick="history.back()">Back</a>
                &nbsp; | &nbsp;

                <a href="javascript:void(0);" onclick="goToHome()">Home</a>
                &nbsp; | &nbsp;

                <a href="javascript:void(0);" onclick="logout()">Logout</a>
            </div>

        </div>

    </div>

    <div class="middlecontent">

        <div class="container">

            <div class="whitesec">

                <div class="inner-padding">

                    <div class="frm-head">
                        <h1>
                            Utsav Feedbacks
                        </h1>
                    </div>

                    <div class="form">

                        <div style="
                display:flex;
                gap:12px;
                align-items:center;
                margin-bottom:10px;
                flex-wrap:wrap;
              ">

                            <input type="text" id="tableSearch" class="form-control search-box"
                                placeholder="Search..." />

                            <button id="summaryBtn" class="btn btn-info" style="white-space:nowrap;">📊 Feedback Summary</button>

                        </div>
                        <div id="downloadBtnContainer"></div>

                    </div>

                    <div class="table-responsive" id="tableContainer"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- Summary Modal -->
    <div id="feedbackSummaryOverlay" class="custom-modal-overlay" style="display:none;">
        <div class="custom-modal-box">
            <span class="custom-modal-close" id="closeSummaryModal">&times;</span>
            <h2>Feedback Summary</h2>
            <hr style="margin:10px 0 20px 0; border:0; border-top:1px solid #eee;">
            <div id="summaryContent" style="font-size:15px; line-height:1.8;"></div>
        </div>
    </div>

</body>

</html>
