<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Check-Out Kiosk</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/custom.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="../../sessionstorage.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="gateOut.js" defer></script>
    <script src="../../style/js/commandPalette.js" defer></script>
    <script src="../../style/js/quickLookup.js" defer></script>
  
    <link rel="stylesheet" href="../../style/css/styles.css">
    
    <style>
        .kiosk-container { max-width: 850px; margin: 20px auto; padding: 0 15px; }
        .kiosk-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden; }
        .mode-btn { padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 13px; border: 1px solid #cbd5e1; cursor: pointer; transition: all 0.2s ease; background: #f8fafc; color: #475569; }
        .mode-btn.active { background: #e11d48; color: #ffffff; border-color: #e11d48; box-shadow: 0 4px 6px -1px rgba(225,29,72,0.3); }
        .status-pill { border-radius: 10px; font-size: 14px; font-weight: 700; padding: 10px 16px; text-align: center; margin-bottom: 16px; display: inline-block; }
        .status-scanning { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .status-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="logout">
                <a href="javascript:void(0);" onclick="history.back()">Back</a>
                &nbsp; | &nbsp; 
                <a href="javascript:void(0);" onclick="goToHome()">Home</a> 
                &nbsp; | &nbsp;
                <a href="javascript:void(0);" onclick="logout()">Logout</a>
            </div>
        </div>
    </div>

    <div class="kiosk-container">
        <div class="kiosk-card">
            
            <!-- Kiosk Header -->
            <div style="background:linear-gradient(135deg, #1e293b 0%, #334155 100%); color:#ffffff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="font-size:26px;">🚪</span>
                    <div>
                        <h2 style="margin:0; font-size:18px; font-weight:700; color:#ffffff;">Gate Check-Out Kiosk</h2>
                        <div style="font-size:12px; color:#cbd5e1; margin-top:2px;">Ashram Exit Management</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span id="liveClockDisplay" style="background:rgba(255,255,255,0.15); color:#fff; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700;">--:--:--</span>
                    <button type="button" onclick="openQuickLookup()" class="btn btn-sm btn-secondary" style="font-size:12px; font-weight:700; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:5px 12px; border-radius:6px;">⚡ Quick Lookup</button>
                </div>
            </div>

            <!-- Mode Selector Bar -->
            <div style="background:#f8fafc; border-bottom:1px solid #e2e8f0; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div style="display:flex; gap:8px;">
                    <button type="button" id="btnModeCamera" class="mode-btn active" onclick="switchKioskMode('camera')">📷 Camera QR Mode</button>
                    <button type="button" id="btnModeManual" class="mode-btn" onclick="switchKioskMode('manual')">🪪 Manual Card Tap Mode</button>
                </div>
                <span style="font-size:12px; color:#64748b; font-weight:600;">System Ready</span>
            </div>

            <!-- Kiosk Content Area -->
            <div style="padding:24px;">
                
                <div id="alert" class="alert" role="alert" style="display:none; margin-bottom:16px;"></div>

                <!-- Camera QR Scanner Section -->
                <div id="qr-scanner-section" style="text-align:center;">
                    <div id="reader" style="width:100%; max-width:380px; margin:0 auto; border-radius:12px; overflow:hidden; border:2px solid #e2e8f0;"></div>
                    <div id="qr-status" class="status-pill status-scanning" style="margin-top:14px;">Initializing camera scanner...</div>
                    <div>
                        <button type="button" id="scan-again-btn" class="btn btn-primary" style="display:none; font-weight:700; padding:8px 20px; border-radius:8px;">Scan Another</button>
                    </div>
                </div>

                <!-- Manual Card Tap Section -->
                <div id="manual-card-section" style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:20px; margin-top:20px; text-align:center;">
                    <h4 style="margin:0 0 10px 0; font-size:15px; font-weight:700; color:#1e293b;">🪪 Tap Card or Enter Card Number</h4>
                    <form id="manualCheckoutForm" style="display:flex; justify-content:center; gap:10px; max-width:480px; margin:0 auto;">
                        <input type="text" id="manualCardNo" placeholder="Enter Card No. (e.g. C001)..." required style="flex:1; padding:10px 14px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; font-weight:700; color:#0f172a; outline:none;" autofocus />
                        <button type="submit" class="btn btn-danger" style="font-weight:700; border-radius:8px; padding:10px 22px; font-size:14px; background:#e11d48; border:none; color:#fff;">Submit Check-Out</button>
                    </form>
                </div>

                <!-- Recent Check-Outs Activity Feed -->
                <div style="margin-top:28px;">
                    <h4 style="margin:0 0 10px 0; font-size:14px; font-weight:700; color:#334155; display:flex; align-items:center; gap:6px;">
                        <span>📋 Recent Gate Exits</span>
                    </h4>
                    <div style="border-radius:10px; border:1px solid #e2e8f0; overflow:hidden;">
                        <table style="width:100%; border-collapse:collapse; font-size:12px;">
                            <thead>
                                <tr style="background:#1e293b; color:#ffffff;">
                                    <th style="padding:8px 12px; text-align:left;">Time</th>
                                    <th style="padding:8px 12px; text-align:left;">Card No</th>
                                    <th style="padding:8px 12px; text-align:left;">Member Name</th>
                                    <th style="padding:8px 12px; text-align:center;">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentScansTableBody">
                                <tr><td colspan="4" style="text-align:center; color:#94a3b8; padding:14px;">No check-outs recorded yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/style/js/roleCheck.js"></script>
    <script>
        checkRoleAccess(['gateAdmin', 'superAdmin']);
    </script>
</body>
</html>
