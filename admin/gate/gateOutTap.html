<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate Check-Out (Tap)</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- Load jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

    <!-- Scripts -->
    <script src="../../style/js/plugin.js"></script>
    <script src="../../style/js/bootstrap-datepicker.min.js"></script>
    <script src="../../style/js/clockpicker.js"></script>
    <script src="../../style/js/custom.js"></script>
    <script src="../../style/js/config.js"></script>
    <script src="/sessionstorage.js"></script>

    <!-- Offline PWA & Kiosk Layer -->
    <script src="../../style/js/offline-db.js"></script>
    <script src="../../style/js/stationAuth.js"></script>
    <script src="../../style/js/scannerCommon.js"></script>
    <script src="../../style/js/pwa-register.js"></script>
    <script src="gateOutTap.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../../style/css/styles.css" />
    <style>
      .big-alert {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        padding: 20px;
        margin-top: 20px;
      }
      .alert-success {
        color: green;
      }
      .alert-danger {
        color: red;
      }
      .alert-warning {
        color: #856404;
      }
      .alert-info {
        color: #0056b3;
      }
      .network-badge-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .network-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
      }
      .network-badge.online {
        background-color: #e6fffa;
        color: #234e52;
        border: 1px solid #b2f5ea;
      }
      .network-badge.offline {
        background-color: #fffaf0;
        color: #7b341e;
        border: 1px solid #feebc8;
      }
      .queue-count {
        font-size: 13px;
        color: #ffffff;
        font-weight: 600;
      }
      .btn-sync, .btn-topbar {
        padding: 3px 10px;
        font-size: 12px;
        border-radius: 4px;
        background-color: #319795;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-topbar-secondary {
        background-color: #4a5568;
      }
      .btn-sync:disabled, .btn-topbar:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .station-clock {
        font-size: 13px;
        color: #e2e8f0;
        font-weight: bold;
        margin-right: 8px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="container">
        <div class="logout">
          <div class="network-badge-container">
            <span class="station-clock">🕒 <span id="station-clock">--:--</span></span>
            <span id="network-badge" class="network-badge online">🟢 Online</span>
            <span id="queue-count" class="queue-count">0 Pending Scans</span>
            <button id="sync-now-btn" class="btn-sync" style="display: none;">Sync Now</button>
            <button id="update-data-btn" class="btn-topbar">⬇️ Update Data</button>
            <button id="pwa-install-btn" class="btn-topbar" style="display: none; background: #2b6cb0;">📲 Install App</button>
            <button id="reset-station-btn" class="btn-topbar btn-topbar-secondary" title="Reset local station cache">🗑️ Reset Station</button>
          </div>
          &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="history.back()">Back</a>
          &nbsp; | &nbsp; <a href="javascript:void(0);" onclick="goToHome()">Home</a> &nbsp; | &nbsp;
          <a href="javascript:void(0);" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>

    <div class="middlecontent">
      <div class="container">
        <div class="whitesec">
          <div class="inner-padding">
            <div class="frm-head">
              <h1>Tap your card for gate exit</h1>
            </div>

            <div id="alert" class="big-alert" style="display: none;"></div>

            <div id="formWrapper">
              <div class="form">
                <form id="gateCheckoutForm">
                  <div class="form-group">
                    <label for="cardno">Tap your card:</label>
                    <input type="text" class="form-control" id="cardno" name="cardno" required autofocus />
                  </div>

                  <div class="form-group form-submit">
                    <button type="submit" class="btn btn-primary">Submit</button>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </body>
</html>
